<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ============================================================
   CAMADA DE ARMAZENAMENTO (services/) — isolada da interface.
   Hoje: localStorage. Amanhã: trocar por chamadas a uma API/Supabase
   mantendo a mesma assinatura de funções (load/save).
   ============================================================ */
const STORAGE_KEY = 'gestor_turmas_v1';

const DIAS = [
  { id:'seg', nome:'Segunda-feira', curto:'Seg' },
  { id:'ter', nome:'Terça-feira',   curto:'Ter' },
  { id:'qua', nome:'Quarta-feira',  curto:'Qua' },
  { id:'qui', nome:'Quinta-feira',  curto:'Qui' },
  { id:'sex', nome:'Sexta-feira',   curto:'Sex' },
  { id:'sab', nome:'Sábado',        curto:'Sáb' },
];

const CATEGORIAS_PADRAO = [
  'Comportamento','Desempenho','Participação','Liderança','Conflito','Problema','Destaque positivo','Organização','Outro'
];

let __seq = 1;
function uid(prefix){ return `${prefix}_${(__seq++).toString(36)}${Math.random().toString(36).slice(2,6)}`; }
function todayISO(offsetDays){ const d = new Date(); d.setDate(d.getDate() + (offsetDays||0)); return d.toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function fmtGrade(v){ return (v===null||v===undefined||v==='') ? '—' : Number(v).toFixed(1).replace('.',','); }
function avg(arr){ const a = arr.filter(v=>typeof v==='number' && !isNaN(v)); if(!a.length) return null; return a.reduce((s,v)=>s+v,0)/a.length; }
function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function pick(arr){ return arr[randInt(0,arr.length-1)]; }

function createEmptyDatabase(){
  const classes = DIAS.map((d,i) => ({ id:d.id, name:d.nome, dayIndex:i, note:'' }));
  return {
    classes,
    groups: [], students: [], individualGrades: [], groupGradesHistory: [],
    diaryEntries: [], groupHistory: [], studentHistory: [], classRepresentatives: [], events: [],
    categories: CATEGORIAS_PADRAO.slice(),
    meta: { demo:false, createdAt: Date.now() }
  };
}

/* Gerador de dados de EXEMPLO — não roda sozinho. Só é usado se o representante
   clicar em "Carregar dados de exemplo" (Relatórios -> Zona de dados), útil
   apenas para testar o sistema antes de cadastrar a turma real. */
function seedDatabase(){
  const nomes = ['João Silva','Maria Souza','Pedro Santos','Carlos Lima','Ana Paula','Lucas Pereira','Fernanda Rocha','Bruno Alves','Camila Dias','Rafael Costa',
  'Juliana Melo','Gustavo Nunes','Larissa Freitas','Diego Ramos','Patrícia Gomes','Thiago Barros','Aline Cardoso','Marcelo Teixeira','Beatriz Moura','Felipe Araújo',
  'Vanessa Pinto','Rodrigo Farias','Débora Martins','André Correia','Priscila Vieira','Leonardo Duarte','Renata Batista','Gabriel Monteiro','Tatiane Xavier','Vinícius Cunha',
  'Simone Azevedo','Otávio Ribeiro','Michele Franco','Caio Bezerra','Adriana Lopes','Hugo Cavalcanti','Natália Borges','Sérgio Pacheco','Cíntia Rezende','Douglas Nogueira'];
  let nomeIdx = 0;
  const nextNome = ()=> nomes[(nomeIdx++) % nomes.length];

  const gruposPorDia = { seg:5, ter:4, qua:6, qui:3, sex:5, sab:2 };
  const rgmSet = new Set();
  const nextRgm = ()=>{ let r; do{ r = String(randInt(100000,999999)); }while(rgmSet.has(r)); rgmSet.add(r); return r; };

  const notasSala = { seg:'Sala 12', ter:'Sala 8', qua:'Sala 12', qui:'Sala 5', sex:'Sala 8', sab:'Sala 3' };
  const classes = DIAS.map(d => ({ id:d.id, name:d.nome, dayIndex: DIAS.indexOf(d), note: `Andrea — ${notasSala[d.id]}` }));
  const groups = [];
  const students = [];
  const individualGrades = [];
  const groupGradesHistory = [];
  const diaryEntries = [];
  const groupHistory = [];
  const studentHistory = [];
  const classRepresentatives = [];
  const events = [
    { id: uid('ev'), date: todayISO(3), title:'Reunião de representantes', description:'Alinhamento mensal com todos os representantes de turma.', createdAt: Date.now() },
    { id: uid('ev'), date: todayISO(10), title:'Entrega de notas', description:'Prazo final para lançar as notas do bimestre.', createdAt: Date.now() },
    { id: uid('ev'), date: todayISO(-2), title:'Confraternização', description:'', createdAt: Date.now() },
  ];

  DIAS.forEach(dia=>{
    const n = gruposPorDia[dia.id];
    for(let g=1; g<=n; g++){
      const groupId = uid('grp');
      const groupGrade = Math.round((randInt(20,50)/10))/1;
      const gradeVal = randInt(20,50)/10;
      groups.push({ id:groupId, classId:dia.id, name:`Grupo ${String(g).padStart(2,'0')}`, status:'ativo', leaderId:null, groupGrade: gradeVal, createdAt: todayISO(-randInt(20,90)) });
      groupGradesHistory.push({ id: uid('gg'), groupId, value: gradeVal, date: todayISO(-randInt(1,15)) });

      const qtdAlunos = randInt(3,7);
      const memberIds = [];
      for(let s=0; s<qtdAlunos; s++){
        const studentId = uid('stu');
        const name = nextNome();
        const grade = randInt(10,50)/10;
        students.push({ id: studentId, name, rgm: nextRgm(), classId: dia.id, groupId, status:'ativo', observations:'', createdAt: todayISO(-randInt(10,80)) });
        individualGrades.push({ id: uid('ig'), studentId, classId: dia.id, groupId, value: grade, label:'Avaliação', date: todayISO(-randInt(1,20)) });
        memberIds.push(studentId);
      }
      if(memberIds.length){
        const leader = pick(memberIds);
        groups.find(x=>x.id===groupId).leaderId = leader;
        groupHistory.push({ id: uid('gh'), groupId, classId: dia.id, date: todayISO(-randInt(5,60)), description: `${students.find(s=>s.id===leader).name} tornou-se líder.` });
      }
    }
  });

  // representantes de turma demonstrativos (2 a 3 por dia, entre os alunos já criados)
  DIAS.forEach(dia=>{
    const classStudents = students.filter(s=>s.classId===dia.id);
    if(!classStudents.length) return;
    const qtd = Math.min(classStudents.length, randInt(2,3));
    const shuffled = [...classStudents].sort(()=>Math.random()-0.5).slice(0, qtd);
    shuffled.forEach(s=> classRepresentatives.push({ id: uid('rep'), classId: dia.id, studentId: s.id, createdAt: todayISO(-randInt(1,60)) }));
  });

  // um pouco de histórico de transferência para demonstrar o rastro preservado
  DIAS.slice(0,3).forEach(dia=>{
    const classGroups = groups.filter(g=>g.classId===dia.id);
    if(classGroups.length >= 2){
      const from = classGroups[0], to = classGroups[1];
      const fromStudents = students.filter(s=>s.classId===dia.id && s.groupId===from.id);
      if(fromStudents.length > 2){
        const st = fromStudents[0];
        const date = todayISO(-randInt(2,10));
        studentHistory.push({ id: uid('sh'), studentId: st.id, date, fromGroupId: from.id, toGroupId: to.id, description: `Transferido de ${from.name} para ${to.name}.` });
        groupHistory.push({ id: uid('gh'), groupId: from.id, classId: dia.id, date, description: `${st.name} saiu do grupo.` });
        groupHistory.push({ id: uid('gh'), groupId: to.id, classId: dia.id, date, description: `${st.name} entrou no grupo.` });
      }
    }
  });

  // diário demonstrativo
  const descricoesPositivas = ['apresentou ótima evolução na atividade.','ajudou os colegas de forma exemplar.','entregou a tarefa com destaque.','demonstrou grande iniciativa.'];
  const descricoesComportamento = ['conversou bastante durante a explicação.','chegou atrasado(a) à atividade.','teve dificuldade para seguir as regras combinadas.'];
  const descricoesParticipacao = ['participou ativamente da discussão em grupo.','ficou mais retraído(a) durante a dinâmica.'];
  for(let i=0;i<24;i++){
    const dia = pick(DIAS);
    const classGroups = groups.filter(g=>g.classId===dia.id);
    if(!classGroups.length) continue;
    const group = pick(classGroups);
    const groupStudents = students.filter(s=>s.groupId===group.id);
    const comAluno = Math.random() > 0.35 && groupStudents.length;
    const aluno = comAluno ? pick(groupStudents) : null;
    let categoria, desc;
    const r = Math.random();
    if(r < 0.35){ categoria='Destaque positivo'; desc = `${aluno?aluno.name:'O grupo'} ${pick(descricoesPositivas)}`; }
    else if(r < 0.6){ categoria='Comportamento'; desc = `${aluno?aluno.name:'O grupo'} ${pick(descricoesComportamento)}`; }
    else if(r < 0.8){ categoria='Participação'; desc = `${aluno?aluno.name:'O grupo'} ${pick(descricoesParticipacao)}`; }
    else { categoria = pick(['Desempenho','Organização','Liderança']); desc = `${aluno?aluno.name:'O grupo'} teve um registro de ${categoria.toLowerCase()} nesta aula.`; }
    diaryEntries.push({ id: uid('de'), date: todayISO(-randInt(0,25)), classId: dia.id, groupId: group.id, studentId: aluno?aluno.id:null, category: categoria, description: desc, createdAt: Date.now() });
  }
  diaryEntries.sort((a,b)=> a.date < b.date ? 1 : -1);

  return { classes, groups, students, individualGrades, groupGradesHistory, diaryEntries, groupHistory, studentHistory, classRepresentatives, events, categories: CATEGORIAS_PADRAO.slice(), meta:{ demo:true, createdAt: Date.now() } };
}

/* Garante que bases salvas antes de um novo recurso (ex.: classRepresentatives)
   não quebrem a tela — preenche qualquer campo novo que esteja faltando. */
function patchDbShape(db){
  const empty = createEmptyDatabase();
  return {
    ...empty, ...db,
    classRepresentatives: db.classRepresentatives || [],
    events: db.events || [],
    classes: (db.classes && db.classes.length ? db.classes : empty.classes).map(c=> ({ note:'', ...c })),
  };
}
function loadDB(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ return patchDbShape(JSON.parse(raw)); }
  }catch(e){ console.warn('Falha ao ler localStorage, recriando dados.', e); }
  const fresh = createEmptyDatabase();
  saveDB(fresh);
  return fresh;
}
function saveDB(db){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); return true; }
  catch(e){ console.error('Falha ao salvar', e); return false; }
}

/* ============================================================
   SINCRONIZAÇÃO COM BANCO SQL (Supabase/Postgres) — opcional.
   Sem configuração, o app funciona 100% em localStorage (um
   navegador só). Com as credenciais abaixo configuradas pela
   própria interface (ícone de banco de dados na barra lateral),
   cada ação também grava nas tabelas SQL, e qualquer dispositivo
   que acesse com as mesmas credenciais lê e escreve na mesma base.
   ============================================================ */
const SB_CONFIG_KEY = 'gestor_turmas_sb_config';

function loadSbConfig(){
  if(window.PACORA_DEFAULT_CONFIG) return window.PACORA_DEFAULT_CONFIG;
  try{ const raw = localStorage.getItem(SB_CONFIG_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function saveSbConfig(cfg){
  try{ if(cfg) localStorage.setItem(SB_CONFIG_KEY, JSON.stringify(cfg)); else localStorage.removeItem(SB_CONFIG_KEY); return true; }
  catch(e){ return false; }
}
function createSbClient(cfg){
  if(!cfg || !cfg.url || !cfg.anonKey) return null;
  if(!window.supabase || !window.supabase.createClient) return null;
  try{ return window.supabase.createClient(cfg.url.trim(), cfg.anonKey.trim()); }
  catch(e){ console.error(e); return null; }
}

/* ---- mapeamento camelCase (app) <-> snake_case (SQL) ---- */
const toClassRow  = c => ({ id:c.id, name:c.name, day_index:c.dayIndex, note:c.note||'' });
const fromClassRow = r => ({ id:r.id, name:r.name, dayIndex:r.day_index, note:r.note||'' });

const toGroupRow  = g => ({ group_grade_note:g.groupGradeNote||'', id:g.id, class_id:g.classId, name:g.name, status:g.status, leader_id:g.leaderId||null, group_grade:(g.groupGrade===undefined?null:g.groupGrade), created_at:g.createdAt });
const fromGroupRow = r => ({ groupGradeNote:r.group_grade_note||'', id:r.id, classId:r.class_id, name:r.name, status:r.status, leaderId:r.leader_id, groupGrade:r.group_grade, createdAt:r.created_at });

const toStudentRow = s => ({ id:s.id, name:s.name, rgm:s.rgm, class_id:s.classId, group_id:s.groupId||null, status:s.status, observations:s.observations||'', whatsapp:s.whatsapp||'', created_at:s.createdAt });
const fromStudentRow = r => ({ id:r.id, name:r.name, rgm:r.rgm, classId:r.class_id, groupId:r.group_id, status:r.status, observations:r.observations||'', whatsapp:r.whatsapp||'', createdAt:r.created_at });

const toIndividualGradeRow = g => ({ id:g.id, student_id:g.studentId, class_id:g.classId, group_id:g.groupId||null, value:g.value, label:g.label, date:g.date, kind:g.kind||'aluno', observation:g.observation||'' });
const fromIndividualGradeRow = r => ({ id:r.id, studentId:r.student_id, classId:r.class_id, groupId:r.group_id, value:Number(r.value), label:r.label, date:r.date, kind:r.kind||'aluno', observation:r.observation||'' });

const toGroupGradeHistoryRow = g => ({ id:g.id, group_id:g.groupId, value:g.value, date:g.date });
const fromGroupGradeHistoryRow = r => ({ id:r.id, groupId:r.group_id, value:Number(r.value), date:r.date });

const toDiaryEntryRow = d => ({ id:d.id, date:d.date, class_id:d.classId, group_id:d.groupId||null, student_id:d.studentId||null, category:d.category, description:d.description, created_at_ms:d.createdAt });
const fromDiaryEntryRow = r => ({ id:r.id, date:r.date, classId:r.class_id, groupId:r.group_id, studentId:r.student_id, category:r.category, description:r.description, createdAt:r.created_at_ms });

const toGroupHistoryRow = h => ({ id:h.id, group_id:h.groupId, class_id:h.classId, date:h.date, description:h.description });
const fromGroupHistoryRow = r => ({ id:r.id, groupId:r.group_id, classId:r.class_id, date:r.date, description:r.description });

const toStudentHistoryRow = h => ({ id:h.id, student_id:h.studentId, date:h.date, from_group_id:h.fromGroupId||null, to_group_id:h.toGroupId||null, description:h.description });
const fromStudentHistoryRow = r => ({ id:r.id, studentId:r.student_id, date:r.date, fromGroupId:r.from_group_id, toGroupId:r.to_group_id, description:r.description });

const toClassRepRow = r => ({ id:r.id, class_id:r.classId, student_id:r.studentId, created_at:r.createdAt });
const fromClassRepRow = r => ({ id:r.id, classId:r.class_id, studentId:r.student_id, createdAt:r.created_at });

const toEventRow = e => ({ id:e.id, date:e.date, title:e.title, description:e.description||'', created_at_ms:e.createdAt });
const fromEventRow = r => ({ id:r.id, date:r.date, title:r.title, description:r.description||'', createdAt:r.created_at_ms });

async function sbUpsert(client, table, row){
  if(!client) return;
  const { error } = await client.from(table).upsert(row);
  if(error) throw error;
}
async function sbInsert(client, table, row){
  if(!client) return;
  const { error } = await client.from(table).insert(row);
  if(error) throw error;
}
async function sbDeleteById(client, table, id, col){
  if(!client) return;
  const { error } = await client.from(table).delete().eq(col||'id', id);
  if(error) throw error;
}
async function sbUpsertCategory(client, name){
  if(!client) return;
  const { error } = await client.from('categories').upsert({ name });
  if(error) throw error;
}
async function sbUpsertMeta(client, isDemo){
  if(!client) return;
  const { error } = await client.from('app_meta').upsert({ id:'singleton', is_demo: !!isDemo });
  if(error) throw error;
}

async function wipeTable(client, table, col){
  const { error } = await client.from(table).delete().not(col||'id','is', null);
  if(error) throw error;
}
async function chunkedInsert(client, table, rows){
  const size = 200;
  for(let i=0;i<rows.length;i+=size){
    const { error } = await client.from(table).insert(rows.slice(i, i+size));
    if(error) throw error;
  }
}

/* Testa a conexão e garante que a turma (classes) e as categorias padrão existam. */
async function testSbConnection(client){
  const { error } = await client.from('classes').select('id').limit(1);
  if(error) throw error;
  return true;
}

/* Busca o banco inteiro do Supabase e monta o objeto `db` no mesmo formato usado no app. */
async function fetchRemoteDB(client){
  const [classesR, groupsR, studentsR, igR, ggR, deR, ghR, shR, catR, metaR, repR, evR] = await Promise.all([
    client.from('classes').select('*'),
    client.from('groups').select('*'),
    client.from('students').select('*'),
    client.from('individual_grades').select('*'),
    client.from('group_grades_history').select('*'),
    client.from('diary_entries').select('*'),
    client.from('group_history').select('*'),
    client.from('student_history').select('*'),
    client.from('categories').select('*'),
    client.from('app_meta').select('*').eq('id','singleton').maybeSingle(),
    client.from('class_representatives').select('*'),
    client.from('events').select('*'),
  ]);
  const firstError = [classesR,groupsR,studentsR,igR,ggR,deR,ghR,shR,catR].map(r=>r.error).find(Boolean);
  if(firstError) throw firstError;
  // class_representatives e events são tabelas novas: se o projeto Supabase ainda não
  // rodou o schema.sql atualizado, ignora silenciosamente em vez de travar a conexão toda.
  if(repR.error) console.warn('Tabela class_representatives ainda não existe no banco. Rode o schema.sql atualizado.', repR.error);
  if(evR.error) console.warn('Tabela events ainda não existe no banco. Rode o schema.sql atualizado.', evR.error);

  let classes = (classesR.data||[]).map(fromClassRow);
  if(classes.length===0){
    classes = DIAS.map((d,i)=> ({ id:d.id, name:d.nome, dayIndex:i, note:'' }));
    const { error } = await client.from('classes').upsert(classes.map(toClassRow));
    if(error) throw error;
  }
  let categories = (catR.data||[]).map(r=>r.name);
  if(categories.length===0){
    categories = CATEGORIAS_PADRAO.slice();
    const { error } = await client.from('categories').upsert(categories.map(name=>({ name })));
    if(error) throw error;
  }

  const groups = (groupsR.data||[]).map(fromGroupRow);
  const isDemo = metaR.data ? !!metaR.data.is_demo : false;

  return {
    classes, categories, groups,
    students: (studentsR.data||[]).map(fromStudentRow),
    individualGrades: (igR.data||[]).map(fromIndividualGradeRow),
    groupGradesHistory: (ggR.data||[]).map(fromGroupGradeHistoryRow),
    diaryEntries: (deR.data||[]).map(fromDiaryEntryRow).sort((a,b)=> a.date<b.date?1:-1),
    groupHistory: (ghR.data||[]).map(fromGroupHistoryRow),
    studentHistory: (shR.data||[]).map(fromStudentHistoryRow),
    classRepresentatives: repR.error ? [] : (repR.data||[]).map(fromClassRepRow),
    events: evR.error ? [] : (evR.data||[]).map(fromEventRow),
    meta: { demo:isDemo, createdAt: Date.now() }
  };
}

/* Substitui TODO o conteúdo das tabelas pelo estado local `db` — usado ao restaurar
   dados demonstrativos ou ao limpar tudo, para manter o banco SQL espelhado. */
async function fullPushDB(client, db){
  const childTables = [
    ['individual_grades', db.individualGrades.map(toIndividualGradeRow)],
    ['group_grades_history', db.groupGradesHistory.map(toGroupGradeHistoryRow)],
    ['diary_entries', db.diaryEntries.map(toDiaryEntryRow)],
    ['group_history', db.groupHistory.map(toGroupHistoryRow)],
    ['student_history', db.studentHistory.map(toStudentHistoryRow)],
    ['class_representatives', (db.classRepresentatives||[]).map(toClassRepRow)],
    ['events', (db.events||[]).map(toEventRow)],
    ['students', db.students.map(toStudentRow)],
    ['groups', db.groups.map(toGroupRow)],
  ];
  for(const [table] of childTables){ try{ await wipeTable(client, table); }catch(e){ console.warn(`Não foi possível limpar ${table} (tabela pode não existir ainda).`, e); } }
  for(const [table, rows] of childTables){ if(rows.length){ try{ await chunkedInsert(client, table, rows); }catch(e){ console.warn(`Não foi possível gravar em ${table}.`, e); } } }
  await client.from('classes').upsert(db.classes.map(toClassRow));
  await client.from('categories').upsert(db.categories.map(name=>({ name })));
  await sbUpsertMeta(client, db.meta && db.meta.demo);
}

/* Monta o link do WhatsApp a partir do número salvo (mantém só dígitos). */
function buildWaLink(number, message){
  const digits = String(number||'').replace(/\D/g,'');
  if(!digits) return null;
  const base = `https://wa.me/${digits}`;
  return message ? `${base}?text=${encodeURIComponent(message)}` : base;
}

/* Botão de contato por WhatsApp para um aluno (líder ou representante).
   Sem número salvo: abre um modal pra cadastrar. Com número: abre o WhatsApp direto. */
function WhatsAppButton({ student, actions, size=13 }){
  const [editing, setEditing] = useState(false);
  const hasNumber = !!(student.whatsapp && student.whatsapp.trim());

  return (
    <React.Fragment>
      <button
        className="btn btn-ghost btn-sm"
        style={{ padding:4, color: hasNumber ? '#16A34A' : 'var(--text-faint)' }}
        title={hasNumber ? `Abrir WhatsApp de ${student.name}` : `Adicionar WhatsApp de ${student.name}`}
        onClick={(e)=>{ e.stopPropagation(); if(hasNumber){ window.open(buildWaLink(student.whatsapp), '_blank'); } else { setEditing(true); } }}
      >
        <Icon path={ICONS.message} size={size}/>
      </button>
      {hasNumber && (
        <button className="btn btn-ghost btn-sm" style={{ padding:4 }} title="Editar número de WhatsApp" onClick={(e)=>{ e.stopPropagation(); setEditing(true); }}>
          <Icon path={ICONS.edit} size={size-2}/>
        </button>
      )}
      {editing && <WhatsAppNumberModal student={student} actions={actions} onClose={()=>setEditing(false)} />}
    </React.Fragment>
  );
}

function WhatsAppNumberModal({ student, actions, onClose }){
  const [value, setValue] = useState(student.whatsapp || '');
  const save = (openAfter)=>{
    const digits = value.replace(/\D/g,'');
    actions.updateStudent(student.id, { whatsapp: digits });
    onClose();
    if(openAfter && digits) window.open(buildWaLink(digits), '_blank');
  };
  return (
    <Modal title={`WhatsApp de ${student.name}`} onClose={onClose} width={420} footer={
      <React.Fragment>
        {student.whatsapp && <button className="btn btn-danger" onClick={()=>{ actions.updateStudent(student.id, { whatsapp:'' }); onClose(); }}>Remover número</button>}
        <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" onClick={()=>save(true)}>Salvar e abrir WhatsApp</button>
      </React.Fragment>
    }>

        <input value={value} onChange={e=>setValue(e.target.value)} placeholder="5511999998888" autoFocus />

function ChartCanvas({ type, data, options, height=220 }){
  const ref = useRef(null);
  const chartRef = useRef(null);
  useEffect(()=>{
    if(!ref.current) return;
    if(chartRef.current) chartRef.current.destroy();
    const cs = getComputedStyle(document.documentElement);
    const tickColor = cs.getPropertyValue('--text-muted').trim() || '#8BA0D0';
    const gridColor = cs.getPropertyValue('--chart-grid').trim() || 'rgba(10,26,74,.08)';
    chartRef.current = new Chart(ref.current.getContext('2d'), {
      type, data,
      options: Object.assign({
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ display: !!(data.datasets && data.datasets.length>1), labels:{ color:tickColor, font:{ family:'Inter', size:11 } } } },
        scales: type==='pie' || type==='doughnut' ? {} : {
          x:{ ticks:{ color:tickColor, font:{ family:'Inter', size:11 } }, grid:{ color:gridColor } },
          y:{ ticks:{ color:tickColor, font:{ family:'Inter', size:11 } }, grid:{ color:gridColor }, beginAtZero:true }
        }
      }, options||{})
    });
    return ()=>{ if(chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(data), document.documentElement.getAttribute('data-theme')]);
  return <div style={{ height }}><canvas ref={ref}/></div>;
}

/* ============================================================
   APP RAIZ — estado central, ações (mutations) e roteamento
   ============================================================ */
function App(){
  const [db, setDb] = useState(()=> loadDB());
  const [screen, setScreen] = useState({ name:'dashboard', params:{} });
  const [toasts, setToasts] = useState([]);
  const [modal, setModal] = useState(null);
  const [searchQuery, setSearchQuery] = useState('');
  const [mobileNavOpen, setMobileNavOpen] = useState(false);

  const [sbConfig, setSbConfig] = useState(()=> loadSbConfig());
  const [sbClient, setSbClient] = useState(null);
  const [syncStatus, setSyncStatus] = useState('local'); // 'local' | 'connecting' | 'connected' | 'error'
  const [syncError, setSyncError] = useState('');
  const sbClientRef = useRef(null);
  const [authState, setAuthState] = useState('checking'); // checking | login | pending | ok
  const [profile, setProfile] = useState(null);
  const [authClient, setAuthClient] = useState(null);
  const [authError, setAuthError] = useState('');
  const LOCAL_KEY = 'gestor_turmas_local';
  const [localMode, setLocalMode] = useState(()=>{ try{ return localStorage.getItem(LOCAL_KEY)==='1'; }catch(e){ return false; } });
  const role = localMode ? 'adm' : (profile && profile.active ? profile.role : null);
  const isAdm = role==='adm';
  const [theme, setTheme] = useState(()=> document.documentElement.getAttribute('data-theme')==='light' ? 'light' : 'dark');
  const toggleTheme = ()=>{ const next = theme==='dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', next); try{ localStorage.setItem('gestor_turmas_theme', next); }catch(e){} setTheme(next); };

  useEffect(()=>{ saveDB(db); }, [db]);

  const auditErr = useRef(false);
  const notify = useCallback((message, tone='info')=>{
    if(tone==='error') auditErr.current = true;
    const id = uid('toast');
    setToasts(t=>[...t, { id, message, tone }]);
    setTimeout(()=> setToasts(t=>t.filter(x=>x.id!==id)), 3400);
  }, []);

  const navigate = useCallback((name, params={})=>{ setScreen({ name, params }); setMobileNavOpen(false); window.scrollTo(0,0); }, []);

  /* ---------- conexão com o banco SQL (opcional) ---------- */
  const enterWithClient = useCallback(async (client)=>{
    const { data:{ user } } = await client.auth.getUser();
    if(!user){ setAuthState('login'); return; }
    const { data:prof, error:pErr } = await client.from('profiles').select('*').eq('id', user.id).maybeSingle();
    if(pErr) throw pErr;
    setProfile(prof||null);
    if(!prof || !prof.active){ setAuthState('pending'); return; }
    client.from('audit_log').insert({ user_id:prof.id, user_email:prof.email||'', user_name:prof.name||'', action:'Entrou no sistema', details:'' }).then(()=>{}, ()=>{});
    const remote = await fetchRemoteDB(client);
    sbClientRef.current = client; setSbClient(client); setDb(remote);
    setSyncStatus('connected'); setSyncError(''); setAuthState('ok');
  }, []);

  useEffect(()=>{
    let cancelled = false;
    setProfile(null); setAuthError('');
    if(localMode || !sbConfig){
      sbClientRef.current = null; setSbClient(null); setAuthClient(null); setSyncStatus('local');
      setAuthState(localMode ? 'ok' : 'login'); return;
    }
    const client = createSbClient(sbConfig);
    if(!client){ setAuthState('login'); setAuthError('Não foi possível iniciar o cliente do banco. Verifique a URL e a chave.'); return; }
    setAuthClient(client); setAuthState('checking'); setSyncStatus('connecting');
    (async ()=>{
      try{
        const { data:{ session } } = await client.auth.getSession();
        if(cancelled) return;
        if(!session){ setSyncStatus('local'); setAuthState('login'); return; }
        await enterWithClient(client);
      }catch(err){
        if(cancelled) return;
        console.error(err);
        sbClientRef.current = null; setSbClient(null); setSyncStatus('error');
        setSyncError((err && err.message) ? err.message : 'Falha ao conectar.');
        setAuthError('Falha ao conectar: verifique a URL, a chave e se o schema.sql foi executado.'); setAuthState('login');
      }
    })();
    return ()=>{ cancelled = true; };
  }, [sbConfig, localMode, enterWithClient]);

  const signIn = async (email, password)=>{
    if(!authClient){ setAuthError('Configure a conexão com o Supabase primeiro.'); return; }
    setAuthError('');
    const { error } = await authClient.auth.signInWithPassword({ email: email.trim(), password });
    if(error){ setAuthError(error.message==='Invalid login credentials' ? 'E-mail ou senha incorretos.' : error.message==='Email not confirmed' ? 'E-mail ainda não confirmado. Peça ao ADM para reativar seu usuário no painel.' : error.message); return; }
    setAuthState('checking');
    try{ await enterWithClient(authClient); }
    catch(err){ setAuthError((err && err.message) || 'Falha ao entrar.'); setAuthState('login'); }
  };
  const signUpInvited = async (email, code, password)=>{
    if(!authClient){ setAuthError('Configure a conexão com o Supabase primeiro.'); return; }
    setAuthError('');
    const { data, error } = await authClient.auth.signUp({ email: email.trim().toLowerCase(), password, options:{ data:{ invite_code: code.trim().toUpperCase() } } });
    if(error){ setAuthError(error.message); return; }
    if(data.user && data.user.identities && data.user.identities.length===0){ setAuthError('Este e-mail já tem cadastro. Use "Entrar".'); return; }
    await signIn(email, password);
  };
  const resetPassword = async (email, code, password)=>{
    if(!authClient){ setAuthError('Configure a conexão com o Supabase primeiro.'); return; }
    setAuthError('');
    const { data, error } = await authClient.rpc('reset_password_with_code', { p_email: email.trim().toLowerCase(), p_code: code.trim().toUpperCase(), p_password: password });
    if(error){ setAuthError(error.message); return; }
    if(data!=='ok'){ setAuthError(data || 'Não foi possível redefinir a senha.'); return; }
    await signIn(email, password);
  };
  const signOut = async ()=>{
    if(localMode){ try{ localStorage.removeItem(LOCAL_KEY); }catch(e){} setLocalMode(false); return; }
    await audit('Saiu do sistema',''); try{ if(authClient) await authClient.auth.signOut(); }catch(e){}
    sbClientRef.current = null; setSbClient(null); setProfile(null); setSyncStatus('local');
    setDb(createEmptyDatabase()); setScreen({ name:'dashboard', params:{} }); setAuthState('login');
  };
  const enterLocalMode = ()=>{ try{ localStorage.setItem(LOCAL_KEY,'1'); }catch(e){} setLocalMode(true); };


  const connectDb = useCallback((cfg)=>{ try{ localStorage.removeItem('gestor_turmas_local'); }catch(e){} setLocalMode(false); saveSbConfig(cfg); setSbConfig(cfg); }, []);
  const disconnectDb = useCallback(()=>{ saveSbConfig(null); setSbConfig(null); sbClientRef.current=null; setSbClient(null); setSyncStatus('local'); setSyncError(''); }, []);

  // conta escritas em andamento no Supabase, pra nunca deixar a atualização automática
  // (polling) sobrescrever uma edição local que ainda está sendo gravada no banco
  const pendingWritesRef = useRef(0);

  /* Busca o estado mais recente do banco sob demanda (botão "Atualizar") — não derruba
     a conexão se falhar, só avisa; usado também pelo polling automático abaixo. */
  const refreshFromDb = useCallback(async (silent)=>{
    const client = sbClientRef.current;
    if(!client) return;
    if(pendingWritesRef.current > 0){ if(!silent) notify('Aguardando uma gravação em andamento antes de atualizar...', 'info'); return; }
    try{
      const remote = await fetchRemoteDB(client);
      if(pendingWritesRef.current > 0) return; // uma escrita começou enquanto buscávamos; não sobrescreve
      setDb(remote);
      if(!silent) notify('Dados atualizados a partir do banco.', 'success');
    }catch(err){
      console.error(err);
      if(!silent) notify('Não foi possível atualizar agora. Veja o console (F12) para detalhes.', 'error');
    }
  }, [notify]);

  /* Atualização automática em segundo plano, para que outro navegador/dispositivo
     apareça sem precisar recarregar a página manualmente. */
  useEffect(()=>{
    if(syncStatus!=='connected') return;
    const interval = setInterval(()=>{ refreshFromDb(true); }, 15000);
    return ()=> clearInterval(interval);
  }, [syncStatus, refreshFromDb]);

  /* roda uma escrita no Supabase sem travar a UI; se falhar, avisa mas mantém a alteração local.
     Enquanto a escrita está em andamento, pausa a atualização automática (acima) pra não
     sobrescrever a edição recém-feita com uma versão antiga vinda do banco. */
  const sbPersist = useCallback((fn)=>{
    const client = sbClientRef.current;
    if(!client) return;
    pendingWritesRef.current += 1;
    Promise.resolve().then(()=> fn(client)).catch(err=>{
      console.error(err);
      notify('Alteração salva apenas neste navegador: falhou ao sincronizar com o banco de dados.', 'error');
    }).finally(()=>{ pendingWritesRef.current = Math.max(0, pendingWritesRef.current - 1); });
  }, [notify]);

  /* ---------- AÇÕES (mutations) ---------- */
  const rawActions = useMemo(()=>({
    addStudent: (classId, { name, rgm, groupId, observations }) => {
      name = (name||'').trim(); rgm = (rgm||'').trim();
      if(!name) return notify('Informe o nome do aluno.', 'error');
      if(!rgm) return notify('Informe o RGM do aluno.', 'error');
      const dupe = db.students.find(s=> s.rgm===rgm && s.status==='ativo');
      if(dupe) return notify(`Já existe um aluno ativo com o RGM ${rgm} (${dupe.name}).`, 'error');
      const id = uid('stu');
      const student = { id, name, rgm, classId, groupId: groupId||null, status:'ativo', observations: observations||'', createdAt: todayISO() };
      const ghEntry = groupId ? { id: uid('gh'), groupId, classId, date: todayISO(), description:`${name} entrou no grupo.` } : null;
      setDb(prev=>({ ...prev, students:[...prev.students, student], groupHistory: ghEntry ? [...prev.groupHistory, ghEntry] : prev.groupHistory }));
      sbPersist(async client=>{
        await sbInsert(client, 'students', toStudentRow(student));
        if(ghEntry) await sbInsert(client, 'group_history', toGroupHistoryRow(ghEntry));
      });
      notify(`${name} foi cadastrado(a).`, 'success');
      return id;
    },

    updateStudent: (studentId, patch) => {
      let updated = null;
      setDb(prev=>({ ...prev, students: prev.students.map(s=>{ if(s.id!==studentId) return s; updated = { ...s, ...patch }; return updated; }) }));
      if(updated) sbPersist(client=> sbUpsert(client, 'students', toStudentRow(updated)));
      notify('Dados do aluno atualizados.', 'success');
    },

    removeStudent: (studentId) => {
      let updatedStudent=null, touchedGroups=[], ghEntry=null;
      setDb(prev=>{
        const s = prev.students.find(x=>x.id===studentId);
        if(!s) return prev;
        const groups = prev.groups.map(g=>{ if(g.leaderId!==studentId) return g; const ng = { ...g, leaderId:null }; touchedGroups.push(ng); return ng; });
        ghEntry = s.groupId ? { id: uid('gh'), groupId: s.groupId, classId: s.classId, date: todayISO(), description:`${s.name} foi removido(a) da turma.` } : null;
        updatedStudent = { ...s, status:'inativo', groupId:null };
        return { ...prev, groups, groupHistory: ghEntry ? [...prev.groupHistory, ghEntry] : prev.groupHistory,
          students: prev.students.map(x=> x.id===studentId ? updatedStudent : x) };
      });
      sbPersist(async client=>{
        if(updatedStudent) await sbUpsert(client, 'students', toStudentRow(updatedStudent));
        for(const g of touchedGroups) await sbUpsert(client, 'groups', toGroupRow(g));
        if(ghEntry) await sbInsert(client, 'group_history', toGroupHistoryRow(ghEntry));
      });
      notify('Aluno removido (histórico preservado).', 'success');
    },

    transferStudent: (studentId, toGroupId) => {
      let updatedStudent=null, shEntry=null, ghEntries=[], updatedFromGroup=null;
      setDb(prev=>{
        const s = prev.students.find(x=>x.id===studentId);
        if(!s) return prev;
        if(s.groupId === toGroupId) return prev;
        const fromGroup = prev.groups.find(g=>g.id===s.groupId);
        const toGroup = prev.groups.find(g=>g.id===toGroupId);
        const date = todayISO();
        shEntry = { id: uid('sh'), studentId, date, fromGroupId: s.groupId||null, toGroupId, description: fromGroup ? `Transferido de ${fromGroup.name} para ${toGroup.name}.` : `Adicionado ao ${toGroup.name}.` };
        ghEntries = [];
        if(fromGroup) ghEntries.push({ id: uid('gh'), groupId: fromGroup.id, classId: s.classId, date, description:`${s.name} saiu do grupo.` });
        ghEntries.push({ id: uid('gh'), groupId: toGroup.id, classId: s.classId, date, description:`${s.name} entrou no grupo.` });
        let groups = prev.groups;
        if(fromGroup && fromGroup.leaderId===studentId){ updatedFromGroup = { ...fromGroup, leaderId:null }; groups = groups.map(g=> g.id===fromGroup.id ? updatedFromGroup : g); }
        updatedStudent = { ...s, groupId: toGroupId };
        return {
          ...prev,
          students: prev.students.map(x=> x.id===studentId ? updatedStudent : x),
          groups,
          studentHistory: [...prev.studentHistory, shEntry],
          groupHistory: [...prev.groupHistory, ...ghEntries]
        };
      });
      if(updatedStudent) sbPersist(async client=>{
        await sbUpsert(client, 'students', toStudentRow(updatedStudent));
        if(updatedFromGroup) await sbUpsert(client, 'groups', toGroupRow(updatedFromGroup));
        await sbInsert(client, 'student_history', toStudentHistoryRow(shEntry));
        for(const h of ghEntries) await sbInsert(client, 'group_history', toGroupHistoryRow(h));
      });
      notify('Aluno transferido de grupo.', 'success');
    },

    addGroup: (classId, name) => {
      name = (name||'').trim();
      if(!name) return notify('Informe o nome do grupo.', 'error');
      const dupe = db.groups.find(g=> g.classId===classId && g.status==='ativo' && g.name.toLowerCase()===name.toLowerCase());
      if(dupe) return notify('Já existe um grupo ativo com esse nome neste dia.', 'error');
      const group = { id: uid('grp'), classId, name, status:'ativo', leaderId:null, groupGrade:null, createdAt: todayISO() };
      setDb(prev=>({ ...prev, groups:[...prev.groups, group] }));
      sbPersist(client=> sbInsert(client, 'groups', toGroupRow(group)));
      notify(`${name} criado.`, 'success');
    },

    renameGroup: (groupId, newName) => {
      newName = (newName||'').trim();
      if(!newName) return notify('Informe um nome válido.', 'error');
      let updatedGroup=null, ghEntry=null;
      setDb(prev=>{
        const g = prev.groups.find(x=>x.id===groupId);
        updatedGroup = { ...g, name:newName };
        ghEntry = { id: uid('gh'), groupId, classId:g.classId, date: todayISO(), description:`Grupo renomeado de "${g.name}" para "${newName}".` };
        return {
          ...prev,
          groups: prev.groups.map(x=> x.id===groupId ? updatedGroup : x),
          groupHistory: [...prev.groupHistory, ghEntry]
        };
      });
      sbPersist(async client=>{ await sbUpsert(client, 'groups', toGroupRow(updatedGroup)); await sbInsert(client, 'group_history', toGroupHistoryRow(ghEntry)); });
      notify('Grupo renomeado.', 'success');
    },

    archiveGroup: (groupId) => {
      let updatedGroup=null, ghEntry=null;
      setDb(prev=>{
        const g = prev.groups.find(x=>x.id===groupId);
        updatedGroup = { ...g, status:'arquivado' };
        ghEntry = { id: uid('gh'), groupId, classId:g.classId, date: todayISO(), description:`Grupo arquivado.` };
        return {
          ...prev,
          groups: prev.groups.map(x=> x.id===groupId ? updatedGroup : x),
          groupHistory: [...prev.groupHistory, ghEntry]
        };
      });
      sbPersist(async client=>{ await sbUpsert(client, 'groups', toGroupRow(updatedGroup)); await sbInsert(client, 'group_history', toGroupHistoryRow(ghEntry)); });
      notify('Grupo arquivado. O histórico foi preservado.', 'success');
    },

    deleteEmptyGroup: (groupId) => {
      setDb(prev=>({ ...prev, groups: prev.groups.filter(g=>g.id!==groupId) }));
      sbPersist(client=> sbDeleteById(client, 'groups', groupId));
      notify('Grupo excluído.', 'success');
    },

    setLeader: (groupId, studentId) => {
      let updatedGroup=null, ghEntries=[];
      setDb(prev=>{
        const g = prev.groups.find(x=>x.id===groupId);
        const oldLeader = g.leaderId ? prev.students.find(s=>s.id===g.leaderId) : null;
        const newLeader = studentId ? prev.students.find(s=>s.id===studentId) : null;
        const lines = [];
        if(oldLeader) lines.push(`${oldLeader.name} deixou de ser líder.`);
        if(newLeader) lines.push(`${newLeader.name} tornou-se líder.`);
        ghEntries = lines.map(desc=> ({ id: uid('gh'), groupId, classId:g.classId, date: todayISO(), description: desc }));
        updatedGroup = { ...g, leaderId: studentId||null };
        return { ...prev, groups: prev.groups.map(x=> x.id===groupId ? updatedGroup : x), groupHistory:[...prev.groupHistory, ...ghEntries] };
      });
      sbPersist(async client=>{ await sbUpsert(client, 'groups', toGroupRow(updatedGroup)); for(const h of ghEntries) await sbInsert(client, 'group_history', toGroupHistoryRow(h)); });
      notify('Liderança do grupo atualizada.', 'success');
    },

    addRepresentative: (classId, studentId) => {
      if(!studentId) return notify('Selecione um aluno.', 'error');
      const already = db.classRepresentatives.find(r=> r.classId===classId && r.studentId===studentId);
      if(already) return notify('Este aluno já é representante desta turma.', 'error');
      const rep = { id: uid('rep'), classId, studentId, createdAt: todayISO() };
      setDb(prev=>({ ...prev, classRepresentatives:[...(prev.classRepresentatives||[]), rep] }));
      sbPersist(client=> sbInsert(client, 'class_representatives', toClassRepRow(rep)));
      notify('Representante adicionado.', 'success');
    },

    removeRepresentative: (repId) => {
      setDb(prev=>({ ...prev, classRepresentatives: (prev.classRepresentatives||[]).filter(r=>r.id!==repId) }));
      sbPersist(client=> sbDeleteById(client, 'class_representatives', repId));
      notify('Representante removido.', 'success');
    },

    /* Anotação fixa por dia da semana (ex.: onde a professora está) — fica salva até
       alguém editar de novo; não muda sozinha, não tem histórico, é só um campo vivo. */
    updateClassNote: (classId, note) => {
      let updatedClass = null;
      setDb(prev=>({ ...prev, classes: prev.classes.map(c=>{ if(c.id!==classId) return c; updatedClass = { ...c, note }; return updatedClass; }) }));
      if(updatedClass) sbPersist(client=> sbUpsert(client, 'classes', toClassRow(updatedClass)));
    },

    addEvent: ({ date, title, description }) => {
      if(!date) return notify('Escolha uma data para o evento.', 'error');
      if(!title || !title.trim()) return notify('Dê um título para o evento.', 'error');
      const event = { id: uid('ev'), date, title: title.trim(), description: (description||'').trim(), createdAt: Date.now() };
      setDb(prev=>({ ...prev, events:[...(prev.events||[]), event] }));
      sbPersist(client=> sbInsert(client, 'events', toEventRow(event)));
      notify('Evento adicionado ao calendário.', 'success');
      return event.id;
    },

    removeEvent: (eventId) => {
      setDb(prev=>({ ...prev, events: (prev.events||[]).filter(e=>e.id!==eventId) }));
      sbPersist(client=> sbDeleteById(client, 'events', eventId));
      notify('Evento removido.', 'success');
    },

    setGroupGrade: (groupId, value, note) => {
      const v = parseFloat(String(value).replace(',','.'));
      if(isNaN(v) || v<0 || v>5) return notify('A nota deve estar entre 0 e 5.', 'error');
      let updatedGroup=null, ggEntry=null, ghEntry=null;
      setDb(prev=>{
        const g = prev.groups.find(x=>x.id===groupId);
        const old = g.groupGrade;
        const desc = (old===null||old===undefined) ? `Nota do grupo definida como ${fmtGrade(v)}.` : `Nota alterada de ${fmtGrade(old)} para ${fmtGrade(v)}.`;
        updatedGroup = { ...g, groupGrade: v, groupGradeNote: (note===undefined ? (g.groupGradeNote||'') : String(note).trim()) };
        ggEntry = { id: uid('gg'), groupId, value:v, date: todayISO() };
        ghEntry = { id: uid('gh'), groupId, classId:g.classId, date: todayISO(), description: desc };
        return {
          ...prev,
          groups: prev.groups.map(x=> x.id===groupId ? updatedGroup : x),
          groupGradesHistory: [...prev.groupGradesHistory, ggEntry],
          groupHistory: [...prev.groupHistory, ghEntry]
        };
      });
      sbPersist(async client=>{
        await sbUpsert(client, 'groups', toGroupRow(updatedGroup));
        await sbInsert(client, 'group_grades_history', toGroupGradeHistoryRow(ggEntry));
        await sbInsert(client, 'group_history', toGroupHistoryRow(ghEntry));
      });
      notify('Nota do grupo registrada.', 'success');
    },

    setIndividualGrade: (studentId, classId, groupId, value, label, kind, observation) => {
      const v = parseFloat(String(value).replace(',','.'));
      if(isNaN(v) || v<0 || v>5) return notify('A nota deve estar entre 0 e 5.', 'error');
      const grade = { id: uid('ig'), studentId, classId, groupId, value:v, label: label||'Avaliação', date: todayISO(), kind: kind||'aluno', observation: (observation||'').trim() };
      setDb(prev=>({ ...prev, individualGrades:[...prev.individualGrades, grade] }));
      sbPersist(client=> sbInsert(client, 'individual_grades', toIndividualGradeRow(grade)));
      notify('Nota individual registrada.', 'success');
    },

    deleteIndividualGrade: (gradeId) => {
      setDb(prev=>({ ...prev, individualGrades: prev.individualGrades.filter(g=>g.id!==gradeId) }));
      sbPersist(client=> sbDeleteById(client, 'individual_grades', gradeId));
      notify('Nota removida.', 'success');
    },

    updateIndividualGrade: (gradeId, value, label, observation) => {
      const v = parseFloat(String(value).replace(',','.'));
      if(isNaN(v) || v<0 || v>5) return notify('A nota deve estar entre 0 e 5.', 'error');
      let updated = null;
      setDb(prev=>({ ...prev, individualGrades: prev.individualGrades.map(g=>{ if(g.id!==gradeId) return g; updated = { ...g, value:v, label: label||g.label, observation: observation===undefined ? (g.observation||'') : String(observation).trim() }; return updated; }) }));
      if(updated) sbPersist(client=> sbUpsert(client, 'individual_grades', toIndividualGradeRow(updated)));
      notify('Nota atualizada.', 'success');
    },

    updateDiaryEntry: (entryId, patch) => {
      if(!patch.description || !patch.description.trim()) return notify('Descreva o registro do diário.', 'error');
      let updated = null;
      setDb(prev=>({ ...prev, diaryEntries: prev.diaryEntries.map(e=>{ if(e.id!==entryId) return e; updated = { ...e, ...patch, description: patch.description.trim() }; return updated; }) }));
      if(updated) sbPersist(client=> sbUpsert(client, 'diary_entries', toDiaryEntryRow(updated)));
      notify('Registro do diário atualizado.', 'success');
    },

    addDiaryEntry: ({ date, classId, groupId, studentId, category, description }) => {
      if(!description || !description.trim()) return notify('Descreva o registro do diário.', 'error');
      if(!category) return notify('Selecione uma categoria.', 'error');
      const entry = { id: uid('de'), date: date||todayISO(), classId, groupId: groupId||null, studentId: studentId||null, category, description: description.trim(), createdAt: Date.now() };
      setDb(prev=>({ ...prev, diaryEntries:[entry, ...prev.diaryEntries] }));
      sbPersist(client=> sbInsert(client, 'diary_entries', toDiaryEntryRow(entry)));
      notify('Registro adicionado ao diário.', 'success');
    },

    addCategory: (name) => {
      name = (name||'').trim();
      if(!name) return;
      setDb(prev=> prev.categories.includes(name) ? prev : ({ ...prev, categories:[...prev.categories, name] }));
      sbPersist(client=> sbUpsertCategory(client, name));
    },

    resetDemoData: () => {
      if(!isAdm) return notify('Apenas o administrador pode substituir os dados.', 'error');
      const fresh = seedDatabase();
      setDb(fresh);
      sbPersist(client=> fullPushDB(client, fresh));
      notify('Dados demonstrativos restaurados.', 'success');
    },

    clearAllData: () => {
      if(!isAdm) return notify('Apenas o administrador pode apagar os dados.', 'error');
      let next = null;
      setDb(prev=>{
        next = {
          classes: prev.classes, categories: prev.categories, events: prev.events,
          groups:[], students:[], individualGrades:[], groupGradesHistory:[], diaryEntries:[], groupHistory:[], studentHistory:[], classRepresentatives:[],
          meta:{ demo:false, createdAt: Date.now() }
        };
        return next;
      });
      sbPersist(client=> fullPushDB(client, next));
      notify('Base limpa. Pronto para seus dados reais.', 'success');
    },
  }), [db, notify, sbPersist, isAdm]);

  const profileRef = useRef(null); profileRef.current = profile;
  const audit = useCallback((action, details)=>{
    const c = sbClientRef.current, pf = profileRef.current;
    if(c && pf){ return c.from('audit_log').insert({ user_id:pf.id, user_email:pf.email||'', user_name:pf.name||'', action, details: details||'' }).then(()=>{}, ()=>{}); }
    try{ const k='gestor_turmas_audit'; const l=JSON.parse(localStorage.getItem(k)||'[]'); l.unshift({ at:new Date().toISOString(), user_email:'modo local', user_name:'', action, details: details||'' }); localStorage.setItem(k, JSON.stringify(l.slice(0,300))); }catch(e){}
  }, []);

  const actions = useMemo(()=>{
    const nm = id => (db.students.find(x=>x.id===id)||{}).name || '?';
    const gn = id => (db.groups.find(x=>x.id===id)||{}).name || '?';
    const f = v => fmtGrade(parseFloat(String(v).replace(',','.')));
    const gradeOf = id => db.individualGrades.find(x=>x.id===id);
    const spec = {
      addStudent: (c,d)=>['Cadastrou aluno', `${d.name} (RGM ${d.rgm}) na turma ${c}`],
      updateStudent: (id,pt)=>['Editou aluno', `${nm(id)}: ${Object.keys(pt).join(', ')}`],
      removeStudent: (id)=>['Removeu aluno', nm(id)],
      transferStudent: (id,to)=>['Transferiu aluno', `${nm(id)} para ${to?gn(to):'sem grupo'}`],
      addGroup: (c,n)=>['Criou grupo', `${n} (turma ${c})`],
      renameGroup: (id,n)=>['Renomeou grupo', `${gn(id)} para ${n}`],
      archiveGroup: (id)=>['Arquivou grupo', gn(id)],
      deleteEmptyGroup: (id)=>['Excluiu grupo', gn(id)],
      setLeader: (g,st)=>['Definiu líder', `${gn(g)}: ${st?nm(st):'sem líder'}`],
      addRepresentative: (c,st)=>['Adicionou representante de turma', `${nm(st)} (turma ${c})`],
      removeRepresentative: ()=>['Removeu representante de turma',''],
      updateClassNote: (c)=>['Atualizou onde a professora está', `turma ${c}`],
      addEvent: (e)=>['Criou evento', `${e.title} (${e.date})`],
      removeEvent: ()=>['Removeu evento',''],
      setGroupGrade: (g,v)=>['Lançou nota do grupo', `${gn(g)}: ${f(v)}`],
      setIndividualGrade: (st,c,g,v,l,k)=>[k==='integrante'?'Lançou nota individual do grupo':'Lançou nota individual', `${nm(st)}: ${f(v)}${l?' ('+l+')':''}${k==='integrante'&&g?' - '+gn(g):''}`],
      updateIndividualGrade: (id,v)=>{ const g=gradeOf(id); return ['Editou nota', `${g?nm(g.studentId):'?'}${g&&g.kind==='integrante'?' (nota individual do grupo)':''}: de ${g?fmtGrade(g.value):'?'} para ${f(v)}`]; },
      deleteIndividualGrade: (id)=>{ const g=gradeOf(id); return ['Apagou nota', g?`${nm(g.studentId)}: nota ${fmtGrade(g.value)}${g.label?' ('+g.label+')':''}${g.kind==='integrante'?' (nota individual do grupo)':''}`:'']; },
      updateDiaryEntry: (id,pt)=>['Editou registro do diário', (pt.description||'').slice(0,80)],
      addDiaryEntry: (e)=>['Registrou no diário', `${e.category}: ${(e.description||'').slice(0,80)}`],
      addCategory: (n)=>['Criou categoria do diário', n],
      resetDemoData: ()=>['Carregou dados de exemplo',''],
      clearAllData: ()=>['Apagou todos os dados','']
    };
    const out = {};
    Object.keys(rawActions).forEach(k=>{
      out[k] = (...args)=>{
        auditErr.current = false;
        const r = rawActions[k](...args);
        if(spec[k] && !auditErr.current){ try{ const [a,d] = spec[k](...args); audit(a,d); }catch(e){} }
        return r;
      };
    });
    return out;
  }, [rawActions, db, audit]);

  /* ---------- helpers de leitura derivada ---------- */
  const getClassStats = useCallback((classId)=>{
    const groups = db.groups.filter(g=> g.classId===classId && g.status==='ativo');
    const students = db.students.filter(s=> s.classId===classId && s.status==='ativo');
    const leaders = groups.filter(g=>g.leaderId).length;
    const media = avg(groups.map(g=>g.groupGrade));
    const mediaIndividual = avg(students.map(st=>{ const gr = db.individualGrades.filter(g=>g.studentId===st.id && (g.kind||'aluno')==='aluno'); return gr.length ? gr[gr.length-1].value : null; }));
    return { groups: groups.length, students: students.length, leaders, media, mediaGrupos: media, mediaIndividual };
  }, [db]);

  const askConfirm = (opts)=> setModal({ type:'confirm', ...opts });
  const closeModal = ()=> setModal(null);

  const sync = { status: syncStatus, error: syncError, config: sbConfig, connect: connectDb, disconnect: disconnectDb, refresh: refreshFromDb, isAdm, role, canLogout: !!profile || localMode, logout: signOut };
  const dbView = useMemo(()=>({ ...db, students: [...db.students].sort((a,b)=> a.name.localeCompare(b.name,'pt-BR',{ sensitivity:'base' })), groups: [...db.groups].sort((a,b)=> a.name.localeCompare(b.name,'pt-BR',{ numeric:true, sensitivity:'base' })) }), [db]);
  const ctx = { db: dbView, actions, audit, notify, navigate, askConfirm, closeModal, setModal, modal, sync, auth:{ isAdm, role, profile, client: sbClientRef.current, localMode } };

  if(authState!=='ok'){
    return (<React.Fragment><AuthScreen state={authState} config={sbConfig} profile={profile} error={authError} onSaveConfig={connectDb} theme={theme} onToggleTheme={toggleTheme} onLogin={signIn} onSignUp={signUpInvited} onResetPassword={resetPassword} onLocal={enterLocalMode} onLogout={signOut} /><ToastHost toasts={toasts} /></React.Fragment>);
  }

  return (
    <div style={{ display:'flex', minHeight:'100vh' }}>
      <Sidebar screen={screen} navigate={navigate} db={dbView} mobileNavOpen={mobileNavOpen} setMobileNavOpen={setMobileNavOpen} sync={sync} setModal={setModal} />
      <div style={{ flex:1, minWidth:0, display:'flex', flexDirection:'column' }}>
        <TopBar theme={theme} toggleTheme={toggleTheme} navigate={navigate} setModal={setModal} setMobileNavOpen={setMobileNavOpen} searchQuery={searchQuery} setSearchQuery={setSearchQuery} db={dbView} sync={sync} />
        <main style={{ flex:1, padding:'22px 26px 60px', maxWidth:1320, width:'100%', margin:'0 auto' }}>
          {syncStatus==='connecting' ? (
            <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'80px 0', color:'var(--text-muted)' }}>
              <Icon path={ICONS.database} size={26} style={{ marginBottom:10 }} />
              <div>Conectando ao banco de dados...</div>
            </div>
          ) : (
            <Router screen={screen} ctx={ctx} getClassStats={getClassStats} />
          )}
        </main>
      </div>
      <MobileNav screen={screen} navigate={navigate} setMobileNavOpen={setMobileNavOpen} />
      <ToastHost toasts={toasts} />
      {modal && modal.type==='confirm' && (
        <ConfirmDialog title={modal.title} message={modal.message} tone={modal.tone} confirmLabel={modal.confirmLabel} cancelLabel={modal.cancelLabel}
          extraOptions={modal.extraOptions} onConfirm={()=>{ modal.onConfirm(); closeModal(); }} onCancel={closeModal} />
      )}
      {modal && modal.type==='quickAdd' && <QuickActionModal ctx={ctx} kind={modal.kind} onClose={closeModal} />}
      {modal && modal.type==='dbSettings' && <DbSettingsModal sync={sync} notify={notify} onClose={closeModal} />}
    </div>
  );
}

   CONFIGURAÇÃO DO BANCO SQL (Supabase) — tudo pela interface.

function DbSettingsModal({ sync, notify, onClose }){
  const [url, setUrl] = useState(sync.config ? sync.config.url : '');
  const [anonKey, setAnonKey] = useState(sync.config ? sync.config.anonKey : '');
  const [testing, setTesting] = useState(false);

  const connect = async ()=>{
    if(!url.trim() || !anonKey.trim()){ notify('Preencha a URL e a chave anônima do Supabase.', 'error'); return; }
    setTesting(true);
    const client = createSbClient({ url, anonKey });
    if(!client){ setTesting(false); notify('Não foi possível iniciar a conexão. Verifique os dados.', 'error'); return; }
    try{
      await testSbConnection(client);
      sync.connect({ url: url.trim(), anonKey: anonKey.trim() });
      notify('Conectado ao banco de dados com sucesso.', 'success');
      onClose();
    }catch(err){
      console.error(err);
      notify('Falha ao conectar: verifique a URL, a chave e se o script SQL foi executado no projeto Supabase.', 'error');
    }finally{ setTesting(false); }
  };

  return (
    <Modal title="Banco de dados (SQL)" onClose={onClose} width={560} footer={
      <React.Fragment>
        {sync.config && <button className="btn btn-danger" onClick={()=>{ sync.disconnect(); notify('Desconectado. Voltando a salvar apenas neste navegador.', 'info'); onClose(); }}>Desconectar</button>}
        {sync.status==='connected' && <button className="btn btn-soft" onClick={()=>sync.refresh(false)}><Icon path={ICONS.refresh} size={14}/> Atualizar agora</button>}
        <button className="btn btn-ghost" onClick={onClose}>Fechar</button>
        <button className="btn btn-primary" onClick={connect} disabled={testing}>{testing?'Conectando...':'Conectar'}</button>
      </React.Fragment>
    }>
      <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:16, padding:'10px 12px', borderRadius:9, background: sync.status==='connected' ? 'var(--success-soft)' : sync.status==='error' ? 'var(--danger-soft)' : 'var(--surface-2)' }}>
        <Icon path={sync.status==='connected' ? ICONS.database : ICONS.cloudOff} size={16} style={{ color: sync.status==='connected' ? 'var(--success-text)' : sync.status==='error' ? 'var(--danger-text)' : 'var(--text-muted)' }} />
        <div style={{ fontSize:12.5 }}>
          {sync.status==='connected' && 'Conectado — os dados são salvos no banco SQL e acessíveis de qualquer dispositivo com estas credenciais. A tela se atualiza sozinha a cada 15s; use "Atualizar agora" para ver na hora.'}
          {sync.status==='error' && (sync.error || 'Falha na conexão.')}
          {sync.status==='local' && 'Nenhum banco conectado — os dados ficam salvos apenas neste navegador.'}
        </div>
      </div>

      <p style={{ fontSize:12.5, color:'var(--text-muted)', lineHeight:1.6, margin:'0 0 16px' }}>
        Para que os dados sejam salvos num banco de verdade (acessível de qualquer navegador/dispositivo), crie um projeto gratuito em <strong>supabase.com</strong>, rode o script <code>schema.sql</code> incluído nesta entrega no "SQL Editor" do projeto, e cole aqui a <strong>Project URL</strong> e a chave <strong>anon public</strong>, encontradas em Project Settings → API.
      </p>

      <Field label="Project URL"><input value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://xxxxxxxx.supabase.co" /></Field>
      <Field label="Chave anon public" hint="Chave pública: não é credencial de administrador. O acesso é protegido pelo login e pelas políticas RLS do Supabase. Nunca use a chave service_role aqui.">
        <input value={anonKey} onChange={e=>setAnonKey(e.target.value)} placeholder="eyJhbGciOiJI..." />
      </Field>
    </Modal>
  );
}

function AllStudentsScreen({ ctx }){
  const { db, navigate } = ctx;
  const [q, setQ] = useState('');
  const [day, setDay] = useState('');
  const [grp, setGrp] = useState('');
  const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const groupsForFilter = db.groups.filter(g=> g.status==='ativo' && (!day || g.classId===day));
  let list = db.students.filter(s=>s.status==='ativo');
  if(day) list = list.filter(s=>s.classId===day);
  if(grp==='__none__') list = list.filter(s=>!s.groupId);
  else if(grp) list = list.filter(s=>s.groupId===grp);
  if(q.trim()){ const n = norm(q); list = list.filter(s=> norm(s.name).includes(n) || (s.rgm||'').includes(q.trim())); }
  list = list.slice().sort((a,b)=> a.name.localeCompare(b.name,'pt-BR'));
  return (
    <div className="fade-up">
      <div style={{ display:'flex', alignItems:'baseline', gap:10, marginBottom:14 }}>
        <h1 style={{ margin:0, fontSize:26 }}>Todos os alunos</h1>
        <span style={{ color:'var(--text-faint)' }}>{list.length} {list.length===1?'aluno':'alunos'}</span>
      </div>
      <div style={{ display:'flex', gap:10, marginBottom:16, flexWrap:'wrap' }}>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Pesquisar por nome ou RGM" style={{ maxWidth:280 }} />
        <select value={day} onChange={e=>{ setDay(e.target.value); setGrp(''); }} style={{ maxWidth:190 }}>
          <option value="">Todos os dias</option>
          {DIAS.map(d=> <option key={d.id} value={d.id}>{d.nome}</option>)}
        </select>
        <select value={grp} onChange={e=>setGrp(e.target.value)} style={{ maxWidth:220 }}>
          <option value="">Todos os grupos</option>
          <option value="__none__">Sem grupo</option>
          {groupsForFilter.map(g=> <option key={g.id} value={g.id}>{day ? g.name : `${(DIAS.find(d=>d.id===g.classId)||{}).curto} · ${g.name}`}</option>)}
        </select>
      </div>
      <div className="card" style={{ overflowX:'auto' }}>
        <table>
          <thead><tr><th>Nome completo</th><th>RGM</th><th>Dia da turma</th><th>Grupo</th></tr></thead>
          <tbody>
            {list.map(s=>{
              const group = db.groups.find(g=>g.id===s.groupId);
              return (
                <tr key={s.id} onClick={()=>navigate('student',{ studentId:s.id })} style={{ cursor:'pointer' }}>
                  <td style={{ fontWeight:600 }}>{s.name}</td>
                  <td style={{ color:'var(--text-muted)' }}>{s.rgm}</td>
                  <td style={{ color:'var(--text-muted)' }}>{(DIAS.find(d=>d.id===s.classId)||{}).nome || '—'}</td>
                  <td>{group ? group.name : <StatusBadge tone="warn">Sem grupo</StatusBadge>}</td>
                </tr>
              );
            })}
            {list.length===0 && <tr><td colSpan={4}><EmptyState text="Nenhum aluno encontrado." /></td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

const INVITE_PREFILL = (function(){
  try{
    if(!location.hash.startsWith('#convite=')) return null;
    const d = JSON.parse(decodeURIComponent(location.hash.slice(9)));
    if(!d || !d.e || !d.c) return null;
    if(d.u && d.k && !window.PACORA_DEFAULT_CONFIG) saveSbConfig({ url:String(d.u), anonKey:String(d.k) });
    try{ localStorage.removeItem('gestor_turmas_local'); }catch(e){}
    history.replaceState(null, '', location.pathname + location.search);
    return { email:String(d.e), code:String(d.c) };
  }catch(e){ return null; }
})();

const RESET_PREFILL = (function(){
  try{
    if(!location.hash.startsWith('#redefinir=')) return null;
    const d = JSON.parse(decodeURIComponent(location.hash.slice(11)));
    if(!d || !d.e || !d.c) return null;
    if(d.u && d.k && !window.PACORA_DEFAULT_CONFIG) saveSbConfig({ url:String(d.u), anonKey:String(d.k) });
    try{ localStorage.removeItem('gestor_turmas_local'); }catch(e){}
    history.replaceState(null, '', location.pathname + location.search);
    return { email:String(d.e), code:String(d.c) };
  }catch(e){ return null; }
})();
(function(){
  try{
    if(!location.hash.startsWith('#conexao=')) return;
    const d = JSON.parse(decodeURIComponent(location.hash.slice(9)));

    history.replaceState(null, '', location.pathname + location.search);
  }catch(e){}
})();
const PRE = RESET_PREFILL || INVITE_PREFILL;

      <div className="card pop-in" style={{ width:'100%', maxWidth:420, padding:26 }}>

                <Field label="Código de convite"><input value={code} onChange={e=>setCode(e.target.value.toUpperCase())} placeholder="Ex.: K7M2QX9P" /></Field>

                <button className="btn btn-soft btn-sm" onClick={saveCfg}>Salvar conexão</button>

function AdminScreen({ ctx }){
  const { auth, sync, notify } = ctx;
  const client = auth.client;
  const [users,setUsers]=useState([]);
  const [form,setForm]=useState({ name:'', email:'', password:'', role:'representante' });
  const [busy,setBusy]=useState(false);
  const [msg,setMsg]=useState('');
  const [invites,setInvites]=useState([]);
  const [lastLink,setLastLink]=useState('');
  const [resetInfo,setResetInfo]=useState(null);
  const [logs,setLogs]=useState([]);
  const [logQ,setLogQ]=useState('');
  const [confirmText,setConfirmText]=useState('');
  const loadUsers = async ()=>{
    if(!client) return;
    const { data, error } = await client.from('profiles').select('*').order('email');
    if(error){ notify('Não foi possível listar os usuários. Rode o schema.sql atualizado.', 'error'); return; }
    setUsers(data||[]);
  };
  const loadInvites = async ()=>{
    if(!client) return;
    const { data } = await client.from('invites').select('*').order('created_at',{ ascending:false });
    setInvites(data||[]);
  };
  const loadLogs = async ()=>{
    if(client){
      const { data, error } = await client.from('audit_log').select('*').order('at',{ ascending:false }).limit(300);
      if(error){ notify('Não foi possível carregar o registro. Rode o schema.sql atualizado.', 'error'); return; }
      setLogs(data||[]);
    } else { try{ setLogs(JSON.parse(localStorage.getItem('gestor_turmas_audit')||'[]')); }catch(e){ setLogs([]); } }
  };
  useEffect(()=>{ loadUsers(); loadInvites(); loadLogs(); }, []);
  if(!auth.isAdm) return <EmptyState text="Acesso restrito ao administrador." />;

  const updateUser = async (u, patch)=>{
    const { error } = await client.rpc('admin_upsert_profile', { p_id:u.id, p_name:u.name||'', p_role: patch.role||u.role, p_active: patch.active!==undefined ? patch.active : u.active });
    if(error) notify('Não foi possível atualizar: '+error.message, 'error'); else { notify('Usuário atualizado.', 'success'); ctx.audit('Alterou usuário', `${u.email}: ${patch.role?'nível '+(patch.role==='adm'?'Administrador':'Representante'):(patch.active?'ativado':'desativado')}`); }
    loadUsers();
  };
  const buildLink = (i)=> location.href.split('#')[0] + '#convite=' + encodeURIComponent(JSON.stringify(window.PACORA_DEFAULT_CONFIG ? { e: i.email, c: i.code } : { u: sync.config.url, k: sync.config.anonKey, e: i.email, c: i.code }));
  const copyLink = async (link)=>{ try{ await navigator.clipboard.writeText(link); notify('Link copiado.', 'success'); }catch(e){ window.prompt('Copie o link:', link); } };
  const genCode = ()=>{ const al='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const r=new Uint32Array(8); crypto.getRandomValues(r); return Array.from(r,x=>al[x%al.length]).join(''); };
  const createInvite = async ()=>{
    const email = form.email.trim().toLowerCase();
    if(!email) return notify('Informe o e-mail do usuário.', 'error');
    setBusy(true);
    try{
      const code = genCode();
      const { error } = await client.from('invites').upsert({ email, name: form.name.trim(), role: form.role, code }, { onConflict:'email' });
      if(error) throw new Error(error.message.includes('invites') ? 'Rode o schema.sql atualizado no Supabase (falta a tabela invites).' : error.message);
      ctx.audit('Gerou convite', `${email} (${form.role==='adm'?'Administrador':'Representante'})`); setMsg('Convite gerado para '+email+'. Copie o link abaixo e envie ao usuário.'); setLastLink(buildLink({ email, code }));
      setForm({ name:'', email:'', password:'', role:'representante' });
      loadInvites();
    }catch(err){ console.error(err); notify(err.message || 'Falha ao gerar o convite.', 'error'); setMsg('Erro: '+(err.message || 'falha ao gerar o convite.')); }
    finally{ setBusy(false); }
  };
  const createReset = async (u)=>{
    try{
      const code = genCode();
      const { error } = await client.rpc('admin_create_reset', { p_email:u.email, p_code:code });
      if(error) throw new Error(error.message.includes('admin_create_reset') ? 'Rode o schema.sql atualizado no Supabase (falta a função de redefinição de senha).' : error.message);
      const link = location.href.split('#')[0] + '#redefinir=' + encodeURIComponent(JSON.stringify(window.PACORA_DEFAULT_CONFIG ? { e:u.email, c:code } : { u:sync.config.url, k:sync.config.anonKey, e:u.email, c:code }));
      setResetInfo({ email:u.email, link }); ctx.audit('Gerou link de redefinição de senha', u.email);
    }catch(err){ console.error(err); notify(err.message || 'Falha ao gerar o link.', 'error'); }
  };
  const revokeInvite = async (id, email)=>{ await client.from('invites').delete().eq('id', id); ctx.audit('Cancelou convite', email||''); loadInvites(); };
  const downloadConfigured = async ()=>{
    try{
      if(!sync.config) return notify('Configure a URL e a chave antes.', 'error');
      const res = await fetch(location.href.split('#')[0], { cache:'no-store' });
      if(!res.ok) throw new Error('Abra o sistema pelo endereço publicado (não pelo arquivo no computador).');
      const html = await res.text();
      const marker = /window\.PACORA_DEFAULT_CONFIG=[\s\S]*?;\/\*cfg\*\//;
      if(!marker.test(html)) throw new Error('Não foi possível preparar o arquivo.');
      const cfg = JSON.stringify({ url: sync.config.url.trim(), anonKey: sync.config.anonKey.trim() });
      const out = html.replace(marker, ()=> 'window.PACORA_DEFAULT_CONFIG='+cfg+';/*cfg*/');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([out], { type:'text/html' })); a.download = 'index.html';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
      ctx.audit('Gerou o arquivo com a conexão embutida', '');
      notify('Arquivo baixado. Publique-o no lugar do atual.', 'success');
    }catch(err){ notify(err.message || 'Falha ao gerar o arquivo.', 'error'); }
  };
  const downloadConfigFile = ()=>{
    if(!sync.config) return notify('Configure a URL e a chave antes.', 'error');
    const blob = new Blob([JSON.stringify({ url: sync.config.url.trim(), anonKey: sync.config.anonKey.trim() }, null, 2)], { type:'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'pacora-config.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    ctx.audit('Gerou o arquivo pacora-config.json', '');
    notify('Arquivo baixado. Envie para a mesma pasta do index.html.', 'success');
  };
  const copyAccessLink = ()=>{
    if(!sync.config) return notify('Configure a URL e a chave antes.', 'error');
    copyLink(location.href.split('#')[0] + '#conexao=' + encodeURIComponent(JSON.stringify({ u: sync.config.url.trim(), k: sync.config.anonKey.trim() })));
  };
  const testConn = async ()=>{ try{ await testSbConnection(client); notify('Conexão funcionando.', 'success'); }catch(err){ notify('Falha na conexão: '+(err.message||''), 'error'); } };

  return (
    <div className="fade-up" style={{ display:'flex', flexDirection:'column', gap:16 }}>

          </React.Fragment>

      </div>

      <div className="card" style={{ padding:18 }}>
        <h3 style={{ margin:'0 0 6px', fontSize:15 }}>Banco de dados (Supabase)</h3>
        <p style={{ margin:'0 0 12px', fontSize:12.5, color:'var(--text-muted)' }}>Situação: {sync.status==='connected'?'conectado':sync.status==='error'?'erro de conexão':'sem banco conectado'}. As alterações são gravadas automaticamente; "Sincronizar agora" busca o que outros dispositivos alteraram.</p>
        <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
          <button className="btn btn-soft btn-sm" onClick={()=>ctx.setModal({ type:'dbSettings' })}>Configurar URL e chave anon</button>
          <button className="btn btn-soft btn-sm" disabled={!client} onClick={testConn}>Testar conexão</button>
          <button className="btn btn-soft btn-sm" disabled={!client} onClick={()=>sync.refresh(false)}>Sincronizar agora</button>
        </div>
        <div style={{ marginTop:16, paddingTop:14, borderTop:'1px solid var(--border)' }}>
          <div style={{ fontWeight:600, fontSize:13.5, marginBottom:4 }}>Conexão automática para os usuários</div>
          <p style={{ margin:'0 0 10px', fontSize:12.5, color:'var(--text-muted)', lineHeight:1.6 }}>
            {window.PACORA_DEFAULT_CONFIG

              : 'Os usuários ainda precisam informar a URL e a chave. Para evitar isso: configure a URL e a chave acima, baixe o pacora-config.json e envie para a mesma pasta do index.html no seu site. Depois disso, ninguém mais digita a conexão, em nenhum navegador.'}

            <button className="btn btn-soft btn-sm" disabled={!sync.config} onClick={copyAccessLink}>Copiar link de acesso</button>
            <button className="btn btn-ghost btn-sm" disabled={!sync.config} onClick={downloadConfigured}>Baixar index.html com a conexão embutida</button>
          </div>
          <div style={{ fontSize:11.5, color:'var(--text-faint)', marginTop:8, lineHeight:1.6 }}>Recomendado: o pacora-config.json. Ele fica ao lado do index.html (no GitHub, na raiz do repositório) e continua valendo mesmo quando o index.html for trocado por uma versão nova. O link de acesso configura um navegador na hora, sem digitar nada.</div>
        </div>
      </div>

      <div className="card" style={{ padding:18 }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', gap:8, flexWrap:'wrap', marginBottom:10 }}>
          <h3 style={{ margin:0, fontSize:15 }}>Registro de atividades</h3>
          <div style={{ display:'flex', gap:8 }}>
            <input value={logQ} onChange={e=>setLogQ(e.target.value)} placeholder="Filtrar por usuário, ação ou detalhe" style={{ maxWidth:260 }} />
            <button className="btn btn-soft btn-sm" onClick={loadLogs}>Atualizar</button>
          </div>
        </div>
        <div style={{ overflow:'auto', maxHeight:420 }}>
          <table>
            <thead><tr><th>Data e hora</th><th>Usuário</th><th>Ação</th><th>Detalhes</th></tr></thead>
            <tbody>
              {logs.filter(l=> !logQ.trim() || `${l.user_name} ${l.user_email} ${l.action} ${l.details}`.toLowerCase().includes(logQ.trim().toLowerCase())).map((l,ix)=> (
                <tr key={l.id||ix}>
                  <td style={{ whiteSpace:'nowrap', color:'var(--text-muted)' }}>{new Date(l.at).toLocaleString('pt-BR')}</td>
                  <td>{l.user_name||l.user_email}{l.user_name?<div style={{ fontSize:11, color:'var(--text-faint)' }}>{l.user_email}</div>:null}</td>
                  <td style={{ fontWeight:600 }}>{l.action}</td>
                  <td style={{ color:'var(--text-muted)' }}>{l.details}</td>
                </tr>
              ))}
              {logs.length===0 && <tr><td colSpan={4}><EmptyState text="Nenhuma atividade registrada ainda." /></td></tr>}
            </tbody>
          </table>
        </div>
        <div style={{ fontSize:11.5, color:'var(--text-faint)', marginTop:8 }}>Mostra as últimas 300 ações. O registro não pode ser editado nem apagado pelo app.</div>
      </div>

      <div className="card" style={{ padding:18, borderColor:'#DC2F2F33' }}>
        <h3 style={{ margin:'0 0 6px', fontSize:15, color:'var(--danger-text)' }}>Apagar os dados</h3>
        <p style={{ margin:'0 0 10px', fontSize:12.5, color:'var(--text-muted)' }}>Remove grupos, alunos, notas, diário e históricos{client?' também do banco':''}. Não pode ser desfeito. Digite <b>APAGAR</b> para liberar o botão.</p>
        <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
          <input value={confirmText} onChange={e=>setConfirmText(e.target.value)} placeholder="APAGAR" style={{ maxWidth:160 }} />
          <button className="btn btn-danger btn-sm" disabled={confirmText!=='APAGAR'} onClick={()=>{ ctx.actions.clearAllData(); setConfirmText(''); }}>Apagar todos os dados</button>
        </div>
      </div>
    </div>
  );
}

function Router({ screen, ctx, getClassStats }){
  const { db, navigate } = ctx;
  switch(screen.name){
    case 'dashboard': return <Dashboard ctx={ctx} getClassStats={getClassStats} />;
    case 'day': return <DayScreen ctx={ctx} classId={screen.params.classId} initialTab={screen.params.tab} getClassStats={getClassStats} />;
    case 'group': return <GroupScreen ctx={ctx} groupId={screen.params.groupId} />;
    case 'student': return <StudentScreen ctx={ctx} studentId={screen.params.studentId} />;
    case 'allStudents': return <AllStudentsScreen ctx={ctx} />;
    case 'admin': return <AdminScreen ctx={ctx} />;
    case 'reports': return <ReportsScreen ctx={ctx} initial={screen.params} />;
    case 'search': return <SearchScreen ctx={ctx} query={screen.params.query||''} />;
    default: return <Dashboard ctx={ctx} getClassStats={getClassStats} />;
  }
}
