function TopBar({ theme, toggleTheme, navigate, setModal, setMobileNavOpen, searchQuery, setSearchQuery, db, sync }){
  const [suggestOpen, setSuggestOpen] = useState(false);
  const [quickOpen, setQuickOpen] = useState(false);
  const suggestions = useMemo(()=>{
    const q = searchQuery.trim().toLowerCase();
    if(!q) return [];
    const students = db.students.filter(s=> s.status==='ativo' && (s.name.toLowerCase().includes(q) || s.rgm.includes(q))).slice(0,5);
    const groups = db.groups.filter(g=> g.status==='ativo' && g.name.toLowerCase().includes(q)).slice(0,4);
    return { students, groups };
  }, [searchQuery, db]);

  const doSearch = (q)=>{ if(!q.trim()) return; navigate('search', { query:q.trim() }); setSuggestOpen(false); };

  return (
    <header style={{ position:'sticky', top:0, zIndex:30, background:'var(--header-bg)', backdropFilter:'blur(8px)', borderBottom:'1px solid var(--border)' }}>
      <div style={{ display:'flex', alignItems:'center', gap:12, padding:'12px 22px', maxWidth:1320, margin:'0 auto' }}>
        <button className="btn btn-ghost btn-sm hide-desktop" onClick={()=>setMobileNavOpen(o=>!o)} style={{ display:'none' }}>☰</button>

        <div className="topbar-search" style={{ position:'relative', flex:1, maxWidth:420 }}>
          <div style={{ position:'relative' }}>
            <Icon path={ICONS.search} size={15} style={{ position:'absolute', left:11, top:'50%', transform:'translateY(-50%)', color:'var(--text-faint)', pointerEvents:'none' }}/>
            <input placeholder="Pesquisar aluno, RGM ou grupo..." value={searchQuery}
              onChange={e=>{ setSearchQuery(e.target.value); setSuggestOpen(true); }}
              onKeyDown={e=>{ if(e.key==='Enter') doSearch(searchQuery); if(e.key==='Escape') setSuggestOpen(false); }}
              onFocus={()=>setSuggestOpen(true)}
              style={{ paddingLeft:32 }} />
          </div>
          {suggestOpen && searchQuery.trim() && (
            <div className="card pop-in" style={{ position:'absolute', top:'110%', left:0, right:0, padding:6, zIndex:50, maxHeight:340, overflowY:'auto', boxShadow:'var(--shadow-2)' }}
              onMouseLeave={()=>setSuggestOpen(false)}>
              {suggestions.students && suggestions.students.length>0 && (
                <div>
                  <div style={{ fontSize:10.5, color:'var(--text-faint)', fontWeight:700, padding:'6px 8px' }}>ALUNOS</div>
                  {suggestions.students.map(s=>(
                    <div key={s.id} onClick={()=>{ navigate('student',{studentId:s.id}); setSuggestOpen(false); setSearchQuery(''); }} className="sidebar-link" style={{ cursor:'pointer', color:'var(--text)' }}>
                      <Icon path={ICONS.users} size={14}/> {s.name} <span style={{ color:'var(--text-faint)', marginLeft:4 }}>RGM {s.rgm}</span>
                    </div>
                  ))}
                </div>
              )}
              {suggestions.groups && suggestions.groups.length>0 && (
                <div>
                  <div style={{ fontSize:10.5, color:'var(--text-faint)', fontWeight:700, padding:'6px 8px' }}>GRUPOS</div>
                  {suggestions.groups.map(g=>(
                    <div key={g.id} onClick={()=>{ navigate('group',{groupId:g.id}); setSuggestOpen(false); setSearchQuery(''); }} className="sidebar-link" style={{ cursor:'pointer', color:'var(--text)' }}>
                      <Icon path={ICONS.grid} size={14}/> {g.name} <span style={{ color:'var(--text-faint)', marginLeft:4 }}>{db.classes.find(c=>c.id===g.classId).name}</span>
                    </div>
                  ))}
                </div>
              )}
              {(!suggestions.students || !suggestions.students.length) && (!suggestions.groups || !suggestions.groups.length) && (
                <div style={{ padding:10, fontSize:12.5, color:'var(--text-faint)' }}>Nenhum resultado. Pressione Enter para busca completa.</div>
              )}
            </div>
          )}
        </div>

        <div className="topbar-spacer" style={{ flex:1 }} />
        <ThemeToggle theme={theme} onToggle={toggleTheme} />

        {sync.status==='connected' && (
          <button className="btn btn-ghost btn-sm" onClick={()=>sync.refresh(false)} title="Buscar alterações feitas em outro dispositivo agora">
            <Icon path={ICONS.refresh} size={14}/>
          </button>
        )}
        <button className="btn btn-ghost btn-sm" onClick={()=>{ if(sync.isAdm) setModal({ type:'dbSettings' }); }} title={sync.status==='connected' ? 'Conectado ao banco SQL' : sync.status==='error' ? 'Erro de conexão com o banco' : 'Salvando apenas neste navegador'}>
          <Icon path={sync.status==='connected' ? ICONS.database : ICONS.cloudOff} size={14} style={{ color: sync.status==='connected' ? 'var(--success)' : sync.status==='error' ? 'var(--danger)' : 'var(--text-faint)' }}/>
          <span className="hide-mobile-label">{sync.status==='connected' ? 'Conectado' : sync.status==='error' ? 'Erro de conexão' : 'Local apenas'}</span>
        </button>

        <div style={{ position:'relative' }}>
          <button className="btn btn-primary btn-sm" onClick={()=>setQuickOpen(o=>!o)}>
            <Icon path={ICONS.bolt} size={14}/> <span className="hide-mobile-label">Ações rápidas</span> <span className="hide-mobile-label"><Icon path={ICONS.down} size={13}/></span>
          </button>
          {quickOpen && (
            <div className="card pop-in" style={{ position:'absolute', right:0, top:'115%', width:220, padding:6, zIndex:50, boxShadow:'var(--shadow-2)' }} onMouseLeave={()=>setQuickOpen(false)}>
              {[
                ['newStudent','+ Novo aluno', ICONS.users],
                ['newGroup','+ Novo grupo', ICONS.grid],
                ['newGrade','+ Lançar nota', ICONS.trophy],
                ['newDiary','+ Registrar diário', ICONS.book],
              ].map(([kind,label,icon])=>(
                <div key={kind} onClick={()=>{ setModal({type:'quickAdd', kind}); setQuickOpen(false); }} className="sidebar-link" style={{ cursor:'pointer', color:'var(--text)' }}>
                  <Icon path={icon} size={14}/> {label}
                </div>
              ))}
              <div onClick={()=>{ navigate('reports'); setQuickOpen(false); }} className="sidebar-link" style={{ cursor:'pointer', color:'var(--text)' }}>
                <Icon path={ICONS.file} size={14}/> Gerar relatório
              </div>
            </div>
          )}
        </div>
      </div>
    </header>
  );
}

/* Modal genérico de ações rápidas do topo — reaproveita os forms das telas */
function QuickActionModal({ ctx, kind, onClose }){
  const { db } = ctx;
  const [classId, setClassId] = useState(DIAS[0].id);
  if(kind==='newStudent') return <StudentFormModal ctx={ctx} classId={classId} setClassId={setClassId} onClose={onClose} showClassPicker />;
  if(kind==='newGroup') return <GroupFormModal ctx={ctx} classId={classId} setClassId={setClassId} onClose={onClose} showClassPicker />;
  if(kind==='newGrade') return <GradeFormModal ctx={ctx} classId={classId} setClassId={setClassId} onClose={onClose} showClassPicker />;
  if(kind==='newDiary') return <DiaryFormModal ctx={ctx} classId={classId} setClassId={setClassId} onClose={onClose} showClassPicker />;
  return null;
}

function Dashboard({ ctx, getClassStats }){
  const { db, navigate, actions } = ctx;
  const [tab, setTab] = useState('overview');
  const totalAlunos = db.students.filter(s=>s.status==='ativo').length;

  const totalLideres = db.groups.filter(g=>g.status==='ativo' && g.leaderId).length;

  const ocorrenciasRecentes = [...db.diaryEntries].sort((a,b)=> a.date<b.date?1:-1).slice(0,6);

  const atividades = useMemo(()=>{
    const items = [];

    db.diaryEntries.forEach(d=> items.push({ date:d.date, text:`Diário: ${d.description}`, type:'diario', classId:d.classId, groupId:d.groupId }));

          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(150px,1fr))', gap:12, marginBottom:22 }}>
            <StatCard label="Total de alunos" value={totalAlunos} icon={ICONS.users} tone="indigo" />
            <StatCard label="Total de grupos" value={totalGrupos} icon={ICONS.grid} tone="teal" />

            <StatCard label="Líderes definidos" value={totalLideres} icon={ICONS.trophy} tone="warn" />
            <StatCard label="Média geral dos grupos" value={mediaGeral===null?'—':fmtGrade(mediaGeral)} icon={ICONS.file} tone="success" />
            <StatCard label="Média individual geral" value={(()=>{ const m = avg(db.students.filter(st=>st.status==='ativo').map(st=>{ const gr = db.individualGrades.filter(g=>g.studentId===st.id && (g.kind||'aluno')==='aluno'); return gr.length ? gr[gr.length-1].value : null; })); return m===null?'—':fmtGrade(m); })()} icon={ICONS.file} tone="indigo" />
          </div>

          <TeacherLocationCard ctx={ctx} />

          <div style={{ marginBottom:12, display:'flex', alignItems:'baseline', justifyContent:'space-between' }}>
            <h2 style={{ fontSize:17, margin:0, fontWeight:600 }}>Turmas da semana</h2>

          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(190px,1fr))', gap:12, marginBottom:28 }}>

                    <div>

                    <span onClick={()=>navigate('group',{groupId:group.id})} style={{ display:'flex', alignItems:'center', gap:8, cursor:'pointer' }}><LeaderBadge/> {student.name}</span>
                    <span style={{ display:'flex', alignItems:'center', gap:4 }}>
                      <span style={{ fontSize:11.5, color:'var(--text-faint)' }}>{group.name} · {db.classes.find(c=>c.id===group.classId).name.replace('-feira','')}</span>

          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16 }} className="grid-stack">
            <div className="card" style={{ padding:18 }}>
              <h3 style={{ margin:'0 0 12px', fontSize:15, fontWeight:600 }}>Ocorrências recentes</h3>
              <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
                {ocorrenciasRecentes.length===0 && <EmptyState small text="Nenhum registro no diário ainda." />}

                  const group = db.groups.find(g=>g.id===o.groupId);
                  return (
                    <div key={o.id} style={{ display:'flex', gap:10, alignItems:'flex-start' }}>
                      <div style={{ marginTop:5 }}><CategoryDot category={o.category}/></div>
                      <div>
                        <div style={{ fontSize:13, lineHeight:1.4 }}>{o.description}</div>
                        <div style={{ fontSize:11, color:'var(--text-faint)', marginTop:2 }}>{fmtDate(o.date)} · {group?group.name:''} · {db.classes.find(c=>c.id===o.classId).name}</div>

                  );
                })}
              </div>
            </div>
            <div className="card" style={{ padding:18 }}>
              <h3 style={{ margin:'0 0 12px', fontSize:15, fontWeight:600 }}>Últimas alterações</h3>
              <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
                {atividades.length===0 && <EmptyState small text="Nenhuma atividade registrada ainda." />}
                {atividades.map((a,idx)=>(
                  <div key={idx} style={{ fontSize:13, lineHeight:1.4, display:'flex', gap:8 }}>
                    <span style={{ color:'var(--text-faint)', fontSize:11.5, flexShrink:0, width:66 }}>{fmtDate(a.date)}</span>
                    <span>{a.text}</span>

      {tab==='representatives' && <RepresentativesTab ctx={ctx} />}

function RepresentativesTab({ ctx }){
  const { db, actions, navigate } = ctx;
  const [addingFor, setAddingFor] = useState(null); // classId em edição

  return (
    <div className="fade-up">
      <p style={{ margin:'0 0 18px', color:'var(--text-muted)', fontSize:13 }}>
        Cada turma pode ter alguns alunos como representantes (diferente do líder, que é por grupo). Recomendado: 2 a 3 por turma.
      </p>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(280px,1fr))', gap:14 }}>
        {DIAS.map(d=>{
          const reps = db.classRepresentatives.filter(r=>r.classId===d.id).map(r=>({ rep:r, student: db.students.find(s=>s.id===r.studentId) })).filter(x=>x.student);
          const classStudents = db.students.filter(s=>s.classId===d.id && s.status==='ativo' && !reps.find(r=>r.student.id===s.id));
          const isAdding = addingFor===d.id;
          return (
            <div key={d.id} className="card" style={{ padding:16 }}>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
                <div style={{ fontWeight:700, fontSize:14.5 }}>{d.nome}</div>
                <StatusBadge tone={reps.length>=2 && reps.length<=3 ? 'success' : 'muted'}>{reps.length} representante{reps.length!==1?'s':''}</StatusBadge>
              </div>

              <div style={{ display:'flex', flexDirection:'column', gap:6, marginBottom:12, minHeight:8 }}>
                {reps.length===0 && <div style={{ fontSize:12.5, color:'var(--text-faint)' }}>Nenhum representante definido.</div>}
                {reps.map(({rep,student})=>(
                  <div key={rep.id} style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'6px 8px', borderRadius:7, background:'var(--surface-2)' }}>
                    <span onClick={()=>navigate('student',{studentId:student.id})} style={{ cursor:'pointer', fontSize:13, fontWeight:600 }}>{student.name}</span>
                    <span style={{ display:'flex', alignItems:'center', gap:2 }}>
                      <WhatsAppButton student={student} actions={actions} />
                      <button className="btn btn-ghost btn-sm" style={{ padding:4 }} title="Remover representante" onClick={()=>actions.removeRepresentative(rep.id)}><Icon path={ICONS.x} size={13}/></button>
                    </span>
                  </div>
                ))}
              </div>

              {isAdding ? (
                <AddRepresentativeInline classId={d.id} students={classStudents} onDone={()=>setAddingFor(null)} ctx={ctx} />
              ) : (
                <button className="btn btn-soft btn-sm" onClick={()=>setAddingFor(d.id)} disabled={classStudents.length===0}>
                  <Icon path={ICONS.plus} size={13}/> Adicionar representante
                </button>
              )}
              {!isAdding && classStudents.length===0 && reps.length===0 && (
                <div style={{ fontSize:11.5, color:'var(--text-faint)', marginTop:6 }}>Cadastre alunos nesta turma primeiro.</div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function AddRepresentativeInline({ classId, students, onDone, ctx }){
  const [studentId, setStudentId] = useState(students[0] ? students[0].id : '');
  const { actions } = ctx;
  return (
    <div style={{ display:'flex', gap:6 }}>
      <select value={studentId} onChange={e=>setStudentId(e.target.value)} style={{ flex:1 }}>
        {students.map(s=> <option key={s.id} value={s.id}>{s.name}</option>)}
      </select>
      <button className="btn btn-primary btn-sm" onClick={()=>{ if(studentId){ actions.addRepresentative(classId, studentId); } onDone(); }}>OK</button>
      <button className="btn btn-ghost btn-sm" onClick={onDone}><Icon path={ICONS.x} size={13}/></button>
    </div>
  );
}

/* ============================================================
   ANOTAÇÃO FIXA POR DIA DA SEMANA — ex.: onde a professora está.
   Fica salva até alguém editar de novo; não há histórico, nem reset semanal.
   ============================================================ */
function TeacherLocationCard({ ctx }){
  return (
    <div className="card" style={{ padding:18, marginBottom:22 }}>
      <h3 style={{ margin:'0 0 4px', fontSize:15, fontWeight:600 }}>Onde está a mamãe Andrea?</h3>
      <p style={{ margin:'0 0 14px', fontSize:12, color:'var(--text-faint)' }}></p>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(220px,1fr))', gap:10 }}>
        {DIAS.map(d=> <TeacherLocationRow key={d.id} dia={d} ctx={ctx} />)}
      </div>
    </div>
  );
}

function TeacherLocationRow({ dia, ctx }){
  const { db, actions } = ctx;
  const cls = db.classes.find(c=>c.id===dia.id);
  const [value, setValue] = useState(cls.note || '');
  const [savedFlash, setSavedFlash] = useState(false);
  const focusedRef = useRef(false);

  // mantém o campo em dia se outro dispositivo atualizar a anotação (polling/refresh) —
  // mas nunca enquanto o representante está digitando aqui, pra não apagar o que ele está escrevendo.
  useEffect(()=>{ if(!focusedRef.current) setValue(cls.note || ''); }, [cls.note]);

  const commit = ()=>{
    focusedRef.current = false;
    if(value === (cls.note||'')) return;
    actions.updateClassNote(dia.id, value);
    setSavedFlash(true);
    setTimeout(()=>setSavedFlash(false), 1200);
  };

  return (
    <div>
      <div style={{ fontSize:11.5, fontWeight:700, color:'var(--text-faint)', marginBottom:5, display:'flex', justifyContent:'space-between' }}>
        <span>{dia.nome.toUpperCase()}</span>
        {savedFlash && <span style={{ color:'var(--success-text)' }}>salvo ✓</span>}
      </div>
      <input
        value={value}
        onFocus={()=>{ focusedRef.current = true; }}
        onChange={e=>setValue(e.target.value)}
        onBlur={commit}
        onKeyDown={e=>{ if(e.key==='Enter') e.currentTarget.blur(); }}
        placeholder="Ex.: Andrea — Sala 12"
      />
    </div>
  );
}

/* ============================================================
   CALENDÁRIO DE EVENTOS
   ============================================================ */
const WEEKDAY_LABELS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function ymKey(date){ return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`; }
function isoFromParts(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function monthLabel(date){ return date.toLocaleDateString('pt-BR', { month:'long', year:'numeric' }); }

function EventsCalendarCard({ ctx }){
  const { db } = ctx;
  const [cursor, setCursor] = useState(()=>{ const t=new Date(); return new Date(t.getFullYear(), t.getMonth(), 1); });
  const [selectedDate, setSelectedDate] = useState(null);
  const [newEventOpen, setNewEventOpen] = useState(false);

  const year = cursor.getFullYear(), month = cursor.getMonth();
  const firstWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayIso = todayISO();

  const eventsByDate = useMemo(()=>{
    const map = {};
    (db.events||[]).forEach(e=> (map[e.date] = map[e.date]||[]).push(e));
    return map;
  }, [db.events]);

  const cells = [];
  for(let i=0;i<firstWeekday;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);

  const upcoming = (db.events||[]).filter(e=> e.date>=todayIso).sort((a,b)=> a.date<b.date?-1:1).slice(0,6);

  return (
    <div className="card" style={{ padding:18, marginBottom:24 }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14, flexWrap:'wrap', gap:8 }}>
        <h3 style={{ margin:0, fontSize:15, fontWeight:600 }}>Calendário de eventos</h3>
        <button className="btn btn-primary btn-sm" onClick={()=>setNewEventOpen(true)}><Icon path={ICONS.plus} size={13}/> Novo evento</button>
      </div>

      <div style={{ display:'grid', gridTemplateColumns:'1.3fr 1fr', gap:20 }} className="grid-stack">
        <div>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10 }}>
            <button className="btn btn-ghost btn-sm" onClick={()=>setCursor(new Date(year, month-1, 1))}><Icon path={ICONS.arrowLeft} size={14}/></button>
            <div style={{ fontSize:13.5, fontWeight:700, textTransform:'capitalize' }}>{monthLabel(cursor)}</div>
            <button className="btn btn-ghost btn-sm" onClick={()=>setCursor(new Date(year, month+1, 1))}><Icon path={ICONS.chevronRight} size={14}/></button>
          </div>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:4, marginBottom:4 }}>
            {WEEKDAY_LABELS.map(w=> <div key={w} style={{ textAlign:'center', fontSize:10.5, color:'var(--text-faint)', fontWeight:700 }}>{w}</div>)}
          </div>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:4 }}>
            {cells.map((d,i)=>{
              if(d===null) return <div key={i}/>;
              const iso = isoFromParts(year, month, d);
              const dayEvents = eventsByDate[iso]||[];
              const isToday = iso===todayIso;
              return (
                <div key={i} onClick={()=>setSelectedDate(iso)}
                  className="card-hover"
                  style={{
                    minHeight:52, borderRadius:8, padding:'5px 6px', cursor:'pointer',
                    border: isToday ? '1px solid var(--accent)' : '1px solid var(--border)',
                    background: dayEvents.length ? 'var(--accent-soft)' : 'var(--surface-2)'
                  }}>
                  <div style={{ fontSize:11.5, fontWeight: isToday?700:500, color: isToday?'var(--accent)':'var(--text-muted)' }}>{d}</div>
                  {dayEvents.slice(0,2).map(ev=>(
                    <div key={ev.id} style={{ fontSize:9.5, color:'var(--text)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', marginTop:2 }}>{ev.title}</div>
                  ))}
                  {dayEvents.length>2 && <div style={{ fontSize:9, color:'var(--text-faint)' }}>+{dayEvents.length-2}</div>}
                </div>
              );
            })}
          </div>
        </div>

        <div>
          <h4 style={{ margin:'0 0 10px', fontSize:12.5, fontWeight:700, color:'var(--text-muted)' }}>PRÓXIMOS EVENTOS</h4>
          <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
            {upcoming.length===0 && <EmptyState small text="Nenhum evento futuro." />}
            {upcoming.map(ev=>(
              <div key={ev.id} onClick={()=>setSelectedDate(ev.date)} className="card card-hover" style={{ padding:10, cursor:'pointer' }}>
                <div style={{ fontSize:11, color:'var(--accent)', fontWeight:700 }}>{fmtDate(ev.date)}</div>
                <div style={{ fontSize:13, fontWeight:600 }}>{ev.title}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {selectedDate && <DayEventsModal date={selectedDate} ctx={ctx} onClose={()=>setSelectedDate(null)} />}
      {newEventOpen && <EventFormModal ctx={ctx} onClose={()=>setNewEventOpen(false)} />}
    </div>
  );
}

function DayEventsModal({ date, ctx, onClose }){
  const { db, actions, askConfirm } = ctx;
  const [adding, setAdding] = useState(false);
  const events = (db.events||[]).filter(e=>e.date===date);

  return (
    <Modal title={fmtDate(date)} onClose={onClose} width={460}>
      <div style={{ display:'flex', flexDirection:'column', gap:8, marginBottom:14 }}>
        {events.length===0 && <EmptyState small text="Nenhum evento nesta data." />}
        {events.map(ev=>(
          <div key={ev.id} className="card" style={{ padding:12 }}>
            <div style={{ display:'flex', justifyContent:'space-between', gap:8 }}>
              <div style={{ fontWeight:600, fontSize:13.5 }}>{ev.title}</div>
              <button className="btn btn-ghost btn-sm" style={{ padding:4 }} onClick={()=> askConfirm({ title:'Remover evento', tone:'danger', confirmLabel:'Remover', message:`Remover o evento "${ev.title}"?`, onConfirm:()=>actions.removeEvent(ev.id) })}>
                <Icon path={ICONS.trash} size={13}/>
              </button>
            </div>
            {ev.description && <div style={{ fontSize:12.5, color:'var(--text-muted)', marginTop:4 }}>{ev.description}</div>}
          </div>
        ))}
      </div>
      {adding ? (
        <EventFormModal ctx={ctx} fixedDate={date} onClose={()=>setAdding(false)} embeddedInline />
      ) : (
        <button className="btn btn-soft btn-sm" onClick={()=>setAdding(true)}><Icon path={ICONS.plus} size={13}/> Adicionar evento nesta data</button>
      )}
    </Modal>
  );
}

function EventFormModal({ ctx, fixedDate, onClose, embeddedInline }){
  const { actions } = ctx;
  const [date, setDate] = useState(fixedDate || todayISO());
  const [title, setTitle] = useState('');
  const [description, setDescription] = useState('');

  const submit = ()=>{
    const id = actions.addEvent({ date, title, description });
    if(id) onClose();
  };

  const fields = (
    <React.Fragment>
      {!fixedDate && <Field label="Data"><input type="date" value={date} onChange={e=>setDate(e.target.value)} /></Field>}
      <Field label="Título"><input value={title} onChange={e=>setTitle(e.target.value)} placeholder="Ex.: Reunião de representantes" autoFocus /></Field>
      <Field label="Descrição (opcional)"><textarea rows={3} value={description} onChange={e=>setDescription(e.target.value)} /></Field>
    </React.Fragment>
  );

  if(embeddedInline){
    return (
      <div className="card" style={{ padding:12, marginTop:4 }}>
        {fields}
        <div style={{ display:'flex', gap:8, justifyContent:'flex-end' }}>
          <button className="btn btn-ghost btn-sm" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary btn-sm" onClick={submit}>Adicionar</button>
        </div>
      </div>
    );
  }

  return (
    <Modal title="Novo evento" onClose={onClose} width={440} footer={
      <React.Fragment><button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
      <button className="btn btn-primary" onClick={submit}>Adicionar</button></React.Fragment>
    }>
      {fields}
    </Modal>
  );
}

function StatCard({ label, value, icon, tone }){
  const toneColor = { indigo:'var(--indigo)', teal:'var(--teal)', accent:'var(--accent)', warn:'var(--warn)', success:'var(--success)' }[tone] || 'var(--text)';
  return (
    <div className="card" style={{ padding:14 }}>
      <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:10, color:toneColor }}>
        <Icon path={icon} size={16}/>
        <span style={{ fontSize:11.5, color:'var(--text-muted)', fontWeight:600 }}>{label}</span>
      </div>
      <div className="font-display" style={{ fontSize:26, fontWeight:600 }}>{value}</div>
    </div>
  );
}

function EmptyState({ text, small }){
  return (
    <div style={{ padding: small? '12px 4px' : '40px 20px', textAlign:'center', color:'var(--text-faint)' }}>
      <div style={{ fontSize: small? 12.5:13.5 }}>{text}</div>
    </div>

function DayScreen({ ctx, classId, initialTab, getClassStats }){
  const { db, navigate, actions, askConfirm, setModal } = ctx;
  const cls = db.classes.find(c=>c.id===classId);
  const [tab, setTab] = useState(initialTab || 'overview');
  useEffect(()=>{ setTab(initialTab || 'overview'); }, [classId]);

  if(!cls) return <EmptyState text="Turma não encontrada." />;
  const stats = getClassStats(classId);

  const tabs = [
    ['overview','Visão geral'],['students','Alunos'],['groups','Grupos'],['grades','Notas'],['diary','Diário'],['history','Histórico']
  ];

  return (
    <div className="fade-up">
      <button onClick={()=>navigate('dashboard')} className="btn btn-ghost btn-sm" style={{ marginBottom:14 }}><Icon path={ICONS.arrowLeft} size={14}/> Dashboard</button>

        <div>
          <h1 style={{ fontSize:25, margin:'0 0 4px', fontWeight:600 }}>{cls.name}</h1>

            <span>{stats.groups} grupos</span><span>·</span><span>{stats.students} alunos</span><span>·</span><span>{stats.leaders} líderes</span><span>·</span><span>Média individual {stats.mediaIndividual===null?'—':fmtGrade(stats.mediaIndividual)}</span><span>·</span><span>Média dos grupos {stats.media===null?'—':fmtGrade(stats.media)}</span>
          </div>
        </div>
        <div style={{ display:'flex', gap:8 }}>
          <button className="btn btn-soft btn-sm" onClick={()=>navigate('reports',{ classId })}><Icon path={ICONS.file} size={14}/> Relatório da turma</button>
        </div>
      </div>

      <div style={{ display:'flex', gap:22, borderBottom:'1px solid var(--border)', marginTop:18, marginBottom:20, overflowX:'auto' }}>
        {tabs.map(([id,label])=>(
          <button key={id} onClick={()=>setTab(id)} className={`tab-btn ${tab===id?'active':''}`} style={{ background:'none' }}>{label}</button>
        ))}
      </div>

      {tab==='overview' && <DayOverviewTab ctx={ctx} classId={classId} stats={stats} />}
      {tab==='students' && <DayStudentsTab ctx={ctx} classId={classId} />}
      {tab==='groups' && <DayGroupsTab ctx={ctx} classId={classId} />}
      {tab==='grades' && <DayGradesTab ctx={ctx} classId={classId} />}

  );

function DayOverviewTab({ ctx, classId, stats }){
  const { db, navigate } = ctx;
  const groups = db.groups.filter(g=>g.classId===classId && g.status==='ativo');
  const barData = {
    labels: groups.map(g=>g.name.replace('Grupo ','G')),

  };
  const recentDiary = db.diaryEntries.filter(d=>d.classId===classId).slice(0,5);

  return (
    <div style={{ display:'grid', gridTemplateColumns:'1.3fr 1fr', gap:16 }} className="grid-stack">

        {Object.keys(catCounts).length ? <ChartCanvas type="doughnut" data={catData} height={230} /> : <EmptyState small text="Sem registros de diário nesta turma." />}
      </div>
      <div className="card" style={{ padding:18, gridColumn:'1 / -1' }}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
          <h3 style={{ margin:0, fontSize:15, fontWeight:600 }}>Últimos registros do diário</h3>
        </div>
        {recentDiary.length===0 && <EmptyState small text="Nenhum registro ainda." />}
        {recentDiary.map(o=>{
          const group = db.groups.find(g=>g.id===o.groupId);
          const student = o.studentId ? db.students.find(s=>s.id===o.studentId) : null;
          return (
            <div key={o.id} style={{ display:'flex', gap:10, padding:'8px 0', borderBottom:'1px solid var(--border-soft)' }}>

                <div style={{ fontSize:13 }}>{o.description}</div>

function DayStudentsTab({ ctx, classId }){
  const { db, actions, navigate, askConfirm, setModal } = ctx;
  const [q, setQ] = useState('');
  const [filterGroup, setFilterGroup] = useState('');
  const groups = db.groups.filter(g=>g.classId===classId && g.status==='ativo');
  let students = db.students.filter(s=>s.classId===classId && s.status==='ativo');
  if(filterGroup) students = students.filter(s=>s.groupId===filterGroup);
  if(q.trim()) students = students.filter(s=> s.name.toLowerCase().includes(q.toLowerCase()) || s.rgm.includes(q.trim()));
  students = [...students].sort((a,b)=> a.name.localeCompare(b.name));

  const [editing, setEditing] = useState(null);
  const [transferring, setTransferring] = useState(null);

  const confirmDelete = (student)=> askConfirm({
    title:'Remover aluno', tone:'danger', confirmLabel:'Remover',
    message: `Remover ${student.name} da turma? O histórico de notas, diário e grupos anteriores será preservado, mas ele(a) deixará de aparecer nas listagens ativas.`,
    onConfirm: ()=> actions.removeStudent(student.id)
  });

  return (
    <div className="fade-up">
      <div style={{ display:'flex', gap:10, marginBottom:16, flexWrap:'wrap' }}>
        <div style={{ position:'relative', flex:1, minWidth:200 }}>
          <Icon path={ICONS.search} size={14} style={{ position:'absolute', left:10, top:9, color:'var(--text-faint)' }}/>
          <input placeholder="Buscar por nome ou RGM..." value={q} onChange={e=>setQ(e.target.value)} style={{ paddingLeft:30 }} />
        </div>
        <select value={filterGroup} onChange={e=>setFilterGroup(e.target.value)} style={{ maxWidth:190 }}>
          <option value="">Todos os grupos</option>
          {groups.map(g=> <option key={g.id} value={g.id}>{g.name}</option>)}

        <button className="btn btn-primary btn-sm" onClick={()=>setEditing('new')}><Icon path={ICONS.plus} size={14}/> Novo aluno</button>

            {students.map(s=>{
              const group = db.groups.find(g=>g.id===s.groupId);
              const grades = db.individualGrades.filter(g=>g.studentId===s.id && (g.kind||'aluno')==='aluno');

                  <td>{last ? fmtGrade(last.value) : '—'}</td>
                  <td>
                    <div style={{ display:'flex', gap:6, justifyContent:'flex-end' }}>
                      <button className="btn btn-ghost btn-sm" title="Transferir" onClick={()=>setTransferring(s)}><Icon path={ICONS.moveRight} size={13}/></button>
                      <button className="btn btn-ghost btn-sm" title="Editar" onClick={()=>setEditing(s)}><Icon path={ICONS.edit} size={13}/></button>

function StudentFormModal({ ctx, classId, setClassId, student, onClose, showClassPicker }){
  const { db, actions } = ctx;
  const cId = showClassPicker ? classId : classId;
  const [name, setName] = useState(student ? student.name : '');
  const [rgm, setRgm] = useState(student ? student.rgm : '');
  const [groupId, setGroupId] = useState(student ? (student.groupId||'') : '');
  const [obs, setObs] = useState(student ? (student.observations||'') : '');
  const groups = db.groups.filter(g=>g.classId===cId && g.status==='ativo');

  const submit = ()=>{
    if(student){
      actions.updateStudent(student.id, { name: name.trim(), rgm: rgm.trim(), groupId: groupId||null, observations: obs });
      if(student.groupId !== (groupId||null)) actions.transferStudent(student.id, groupId||null);
    } else {
      actions.addStudent(cId, { name, rgm, groupId: groupId||null, observations: obs });
    }
    onClose();
  };

  return (
    <Modal title={student ? 'Editar aluno' : 'Novo aluno'} onClose={onClose} footer={
      <React.Fragment><button className="btn btn-ghost" onClick={onClose}>Cancelar</button><button className="btn btn-primary" onClick={submit}>{student?'Salvar':'Cadastrar'}</button></React.Fragment>
    }>
      {showClassPicker && (
        <Field label="Turma / dia">
          <select value={cId} onChange={e=>setClassId(e.target.value)}>{DIAS.map(d=> <option key={d.id} value={d.id}>{d.nome}</option>)}</select>
        </Field>
      )}
      <Field label="Nome completo"><input value={name} onChange={e=>setName(e.target.value)} placeholder="Ex.: João Silva" autoFocus /></Field>
      <Field label="RGM" hint="Identificador único do aluno."><input value={rgm} onChange={e=>setRgm(e.target.value)} placeholder="Ex.: 123456" /></Field>
      <Field label="Grupo">
        <select value={groupId} onChange={e=>setGroupId(e.target.value)}>
          <option value="">Sem grupo</option>
          {groups.map(g=> <option key={g.id} value={g.id}>{g.name}</option>)}
        </select>
      </Field>
      <Field label="Observações"><textarea rows={3} value={obs} onChange={e=>setObs(e.target.value)} placeholder="Opcional" /></Field>
    </Modal>
  );
}

function GroupCardsGrid({ ctx, groups, classId }){
  const { db, navigate, actions, askConfirm } = ctx;
  if(groups.length===0) return <EmptyState text="Nenhum grupo cadastrado ainda. Clique em 'Adicionar grupo'." />;

  const requestArchive = (group)=>{
    const members = db.students.filter(s=>s.groupId===group.id && s.status==='ativo');
    const hasHistory = db.groupHistory.some(h=>h.groupId===group.id) || db.diaryEntries.some(d=>d.groupId===group.id);
    if(members.length===0 && !hasHistory){
      askConfirm({ title:'Excluir grupo', tone:'danger', confirmLabel:'Excluir', message:`Excluir "${group.name}" permanentemente? Este grupo não possui alunos nem histórico.`, onConfirm:()=> actions.deleteEmptyGroup(group.id) });
      return;
    }
    askConfirm({
      title:'Grupo possui alunos ou histórico', tone:'default', confirmLabel:'Arquivar grupo',
      message:`"${group.name}" possui ${members.length} aluno(s) e/ou histórico associado. Para preservar os dados, recomendamos arquivar o grupo em vez de excluí-lo. Transfira os alunos primeiro, se necessário.`,
      extraOptions: <button className="btn btn-soft" onClick={()=>{ ctx.closeModal(); navigate('group',{groupId:group.id}); }}>Transferir alunos primeiro</button>,
      onConfirm: ()=> actions.archiveGroup(group.id)
    });
  };

  return (
    <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(230px,1fr))', gap:14 }}>
      {groups.map((g,i)=>{
        const members = db.students.filter(s=>s.groupId===g.id && s.status==='ativo');
        const leader = g.leaderId ? db.students.find(s=>s.id===g.leaderId) : null;
        return (
          <div key={g.id} className="card card-hover fade-up" style={{ padding:16, animationDelay:`${i*35}ms`, display:'flex', flexDirection:'column' }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:10 }}>
              <div style={{ fontWeight:700, fontSize:14.5 }}>{g.name}</div>
              <button className="btn btn-ghost btn-sm" onClick={()=>requestArchive(g)} style={{ padding:5 }} title="Excluir/arquivar"><Icon path={ICONS.trash} size={13}/></button>
            </div>
            <div style={{ display:'flex', alignItems:'center', gap:6, fontSize:13, color:'var(--text-muted)', marginBottom:12, minHeight:18 }}>
              {leader ? <React.Fragment><LeaderBadge/> {leader.name}</React.Fragment> : <span style={{ color:'var(--text-faint)' }}>Sem líder definido</span>}
            </div>
            <div style={{ display:'flex', gap:14, marginBottom:14 }}>
              <div><div style={{ fontWeight:700, fontSize:17 }}>{members.length}</div><div style={{ fontSize:10.5, color:'var(--text-faint)' }}>integrantes</div></div>
              <div><div style={{ fontWeight:700, fontSize:17 }}>{g.groupGrade===null||g.groupGrade===undefined?'—':fmtGrade(g.groupGrade)}</div><div style={{ fontSize:10.5, color:'var(--text-faint)' }}>nota</div></div>
            </div>
            <button className="btn btn-soft btn-sm" onClick={()=>navigate('group',{groupId:g.id})} style={{ marginTop:'auto', justifyContent:'center' }}>Ver grupo <Icon path={ICONS.chevronRight} size={13}/></button>
          </div>
        );
      })}
    </div>
  );
}

function groupMemberAverage(db, groupId){
  const members = db.students.filter(s=>s.groupId===groupId && s.status==='ativo').sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
  const rows = members.map(m=>{
    const gs = db.individualGrades.filter(g=>g.studentId===m.id && g.groupId===groupId && g.kind==='integrante');
    const last = gs[gs.length-1];
    return { student:m, value: last ? last.value : null };
  });
  const total = rows.reduce((s,r)=> s + (r.value||0), 0);
  return { rows, average: rows.length ? total/rows.length : null };
}

        <div className="card" style={{ padding:'10px 14px', flex:'1 1 230px' }}>
          <div style={{ fontSize:11, color:'var(--text-faint)', fontWeight:700, letterSpacing:'.04em' }}>MÉDIA DOS GRUPOS (NOTA DO GRUPO)</div>
          <div style={{ fontSize:20, fontWeight:700 }}>{fmtGrade(mediaGr)}</div>
        </div>
        <div className="card" style={{ padding:'10px 14px', flex:'1 1 230px' }}>
          <div style={{ fontSize:11, color:'var(--text-faint)', fontWeight:700, letterSpacing:'.04em', marginBottom:6 }}>FILTRAR POR NOTA</div>
          <select value={gf} onChange={e=>setGf(e.target.value)}>
            <option value="">Todas as notas</option><option value="5">Nota 5 (máxima)</option><option value="4">Somente nota 4</option><option value="3">Somente nota 3</option>
            <option value="2">Somente nota 2</option><option value="1">Somente nota 1</option><option value="zero">Zerados ou sem nota</option>
          </select>
        </div>
      </div>

      {sub!=='group' ? (
        <div className="card" style={{ overflowX:'auto' }}>
          <table>
            <thead><tr><th>Aluno</th><th>Grupo</th><th>Última nota</th><th>Notas (clique para editar)</th><th></th></tr></thead>
            <tbody>
              {students.filter(s=> !gf || gradeBucket(lastFor(s))===gf).map(s=>{
                const grades = db.individualGrades.filter(g=>g.studentId===s.id && (g.kind||'aluno')===kind && (kind==='aluno' || g.groupId===s.groupId));
                const last = grades[grades.length-1];
                const group = db.groups.find(g=>g.id===s.groupId);
                const blocked = kind==='integrante' && !s.groupId;
                return (
                  <tr key={s.id}>
                    <td style={{ fontWeight:600 }}>{s.name}</td>
                    <td style={{ color:'var(--text-muted)' }}>{group?group.name:'—'}</td>
                    <td>{last?fmtGrade(last.value):'—'}</td>
                    <td>
                      <div style={{ display:'flex', gap:5, flexWrap:'wrap' }}>

                        {grades.length===0 && <span style={{ color:'var(--text-faint)' }}>—</span>}
                        {last && last.observation && <div style={{ flexBasis:'100%', fontSize:11.5, color:'var(--text-muted)' }}>Obs.: {last.observation}</div>}
                      </div>
                    </td>
                    <td><button className="btn btn-soft btn-sm" disabled={blocked} title={blocked?'O aluno precisa estar em um grupo':''} onClick={()=>setGradeModal({ student:s, kind })}>Lançar nota</button></td>
                  </tr>
                );
              })}
              {students.length===0 && <tr><td colSpan={5}><EmptyState text="Nenhum aluno nesta turma." /></td></tr>}
            </tbody>
          </table>
        </div>
      ) : (
        <div className="card" style={{ overflowX:'auto' }}>
          <table>
            <thead><tr><th>Grupo</th><th>Integrantes</th><th>Média dos integrantes</th><th>Nota atual</th><th></th></tr></thead>
            <tbody>
              {groups.filter(x=> !gf || gradeBucket(x.groupGrade)===gf).map(g=>{
                const calc = groupMemberAverage(db, g.id);
                const has = g.groupGrade!==null && g.groupGrade!==undefined;
                return (
                  <tr key={g.id}>
                    <td style={{ fontWeight:600 }}>{g.name}</td>
                    <td style={{ color:'var(--text-muted)' }}>{calc.rows.length}</td>
                    <td style={{ color:'var(--text-muted)' }}>{fmtGrade(calc.average)}</td>
                    <td>{has?fmtGrade(g.groupGrade):'—'}{g.groupGradeNote?<div style={{ fontSize:11.5, color:'var(--text-muted)', fontWeight:400 }}>Obs.: {g.groupGradeNote}</div>:null}</td>
                    <td><button className="btn btn-soft btn-sm" onClick={()=>setGroupGradeModal(g)}>{has?'Editar nota':'Definir nota'}</button></td>
                  </tr>
                );
              })}
              {groups.length===0 && <tr><td colSpan={5}><EmptyState text="Nenhum grupo nesta turma." /></td></tr>}
            </tbody>
          </table>
        </div>
      )}

      {gradeModal && <GradeFormModal ctx={ctx} classId={classId} fixedStudent={gradeModal.student} kind={gradeModal.kind} onClose={()=>setGradeModal(null)} />}
      {editGrade && <EditGradeModal ctx={ctx} grade={editGrade} onClose={()=>setEditGrade(null)} />}
      {groupGradeModal && <GroupGradeModal ctx={ctx} group={groupGradeModal} onClose={()=>setGroupGradeModal(null)} />}
    </div>
  );
}

function GradeFormModal({ ctx, classId, setClassId, fixedStudent, onClose, showClassPicker, kind='aluno' }){
  const { db, actions } = ctx;
  const cId = classId;
  const students = db.students.filter(s=>s.classId===cId && s.status==='ativo').sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
  const [studentId, setStudentId] = useState(fixedStudent ? fixedStudent.id : (students[0]?students[0].id:''));
  const [label, setLabel] = useState('Avaliação');
  const [value, setValue] = useState('');
  const [obs, setObs] = useState('');
  const student = db.students.find(s=>s.id===studentId);
  useEffect(()=>{
    if(fixedStudent) return;
    if(!students.find(s=>s.id===studentId)) setStudentId(students[0] ? students[0].id : '');
  }, [cId]);

  return (
    <Modal title={kind==='integrante' ? 'Lançar nota de integrante do grupo' : 'Lançar nota individual'} onClose={onClose} footer={
      <React.Fragment><button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
      <button className="btn btn-primary" onClick={()=>{ if(!student) return; actions.setIndividualGrade(student.id, student.classId, student.groupId, value, label, kind, obs); onClose(); }}>Salvar</button></React.Fragment>
    }>
      {showClassPicker && (
        <Field label="Turma / dia"><select value={cId} onChange={e=>setClassId(e.target.value)}>{DIAS.map(d=> <option key={d.id} value={d.id}>{d.nome}</option>)}</select></Field>
      )}
      {!fixedStudent && (
        <Field label="Aluno">
          <select value={studentId} onChange={e=>setStudentId(e.target.value)}>{students.map(s=> <option key={s.id} value={s.id}>{s.name}</option>)}</select>
        </Field>
      )}
      <Field label="Identificação (opcional)"><input value={label} onChange={e=>setLabel(e.target.value)} placeholder="Ex.: Prova 1, Trabalho, Participação" /></Field>
      <Field label="Nota (0 a 5)"><input type="text" inputMode="decimal" value={value} onChange={e=>setValue(e.target.value)} placeholder="Ex.: 4,5" autoFocus /></Field>
      <Field label="Observação (opcional)"><textarea rows={2} value={obs} onChange={e=>setObs(e.target.value)} placeholder="Ex.: entregou fora do prazo" /></Field>
    </Modal>
  );
}

function EditGradeModal({ ctx, grade, onClose }){
  const student = ctx.db.students.find(s=>s.id===grade.studentId);
  const [value, setValue] = useState(String(grade.value).replace('.',','));
  const [label, setLabel] = useState(grade.label||'');
  const [obs, setObs] = useState(grade.observation||'');
  return (
    <Modal title={`Editar nota${student ? ' · '+student.name : ''}`} onClose={onClose} footer={
      <React.Fragment><button className="btn btn-danger btn-sm" style={{ marginRight:'auto' }} onClick={()=>{ onClose(); ctx.askConfirm({ title:'Remover nota', tone:'danger', confirmLabel:'Remover', message:`Remover a nota ${fmtGrade(grade.value)}${grade.label?' ('+grade.label+')':''}${student?' de '+student.name:''}? Isso não pode ser desfeito.`, onConfirm:()=>ctx.actions.deleteIndividualGrade(grade.id) }); }}>Remover nota</button>
      <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
      <button className="btn btn-primary" onClick={()=>{ ctx.actions.updateIndividualGrade(grade.id, value, label, obs); onClose(); }}>Salvar alteração</button></React.Fragment>
    }>
      <Field label="Identificação"><input value={label} onChange={e=>setLabel(e.target.value)} /></Field>
      <Field label="Nota (0 a 5)"><input type="text" inputMode="decimal" value={value} onChange={e=>setValue(e.target.value)} autoFocus /></Field>
      <Field label="Observação (opcional)"><textarea rows={2} value={obs} onChange={e=>setObs(e.target.value)} placeholder="Ex.: entregou fora do prazo" /></Field>
    </Modal>
  );
}

function GroupGradeModal({ ctx, group, onClose }){
  const { db, actions } = ctx;
  const [value, setValue] = useState(group.groupGrade!==null && group.groupGrade!==undefined ? String(group.groupGrade).replace('.',',') : '');
  const [note, setNote] = useState(group.groupGradeNote||'');
  const calc = groupMemberAverage(db, group.id);
  const fill = ()=>{
    if(calc.average===null) return ctx.notify('O grupo não tem integrantes.', 'error');
    setValue((Math.round(calc.average*100)/100).toString().replace('.',','));
  };
  return (
    <Modal title={`Nota do ${group.name}`} onClose={onClose} footer={
      <React.Fragment><button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
      <button className="btn btn-primary" onClick={()=>{ actions.setGroupGrade(group.id, value, note); onClose(); }}>Salvar</button></React.Fragment>
    }>
      <Field label="Nota do grupo (0 a 5)"><input type="text" inputMode="decimal" value={value} onChange={e=>setValue(e.target.value)} placeholder="Ex.: 4,0" autoFocus /></Field>
      <Field label="Observação (opcional)"><textarea rows={2} value={note} onChange={e=>setNote(e.target.value)} placeholder="Ex.: entregou fora do prazo" /></Field>
      <div className="card" style={{ padding:12, marginTop:6 }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8, gap:8 }}>
          <div style={{ fontWeight:600 }}>Média dos integrantes: {fmtGrade(calc.average)}</div>
          <button className="btn btn-soft btn-sm" onClick={fill}>Calcular média dos integrantes</button>
        </div>
        {calc.rows.map(r=> (
          <div key={r.student.id} style={{ display:'flex', justifyContent:'space-between', fontSize:12.5, color:'var(--text-muted)', padding:'2px 0' }}>
            <span>{r.student.name}</span><span>{r.value===null ? '0,0 (sem nota)' : fmtGrade(r.value)}</span>
          </div>
        ))}
        <div style={{ fontSize:11.5, color:'var(--text-faint)', marginTop:8 }}>Usa a última nota de integrante de cada aluno; quem não tem nota conta como 0. A média só vira a nota do grupo depois de salvar.</div>
      </div>
    </Modal>
  );
}

function DiaryFormModal({ ctx, classId, setClassId, onClose, showClassPicker, fixedGroup, fixedStudent }){
  const { db, actions } = ctx;
  const cId = classId;
  const [date, setDate] = useState(todayISO());
  const [groupId, setGroupId] = useState(fixedGroup ? fixedGroup.id : '');
  const [studentId, setStudentId] = useState(fixedStudent ? fixedStudent.id : '');
  const [category, setCategory] = useState(db.categories[0]);
  const [newCat, setNewCat] = useState('');
  const [description, setDescription] = useState('');
  const groups = db.groups.filter(g=>g.classId===cId && g.status==='ativo');
  const students = db.students.filter(s=> s.classId===cId && s.status==='ativo' && (!groupId || s.groupId===groupId));

  useEffect(()=>{
    if(fixedGroup || fixedStudent) return;
    if(groupId && !groups.find(g=>g.id===groupId)) setGroupId('');
  }, [cId]);

  const submit = ()=>{
    let cat = category;
    if(category==='__new__'){ if(!newCat.trim()) { actions && ctx.notify('Informe o nome da nova categoria.', 'error'); return; } actions.addCategory(newCat.trim()); cat = newCat.trim(); }
    actions.addDiaryEntry({ date, classId: cId, groupId: groupId||null, studentId: studentId||null, category: cat, description });
    onClose();
  };

  return (
    <Modal title="Registrar no diário" onClose={onClose} width={560} footer={
      <React.Fragment><button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
      <button className="btn btn-primary" onClick={submit}>Salvar registro</button></React.Fragment>
    }>
      <div style={{ display:'grid', gridTemplateColumns: showClassPicker? '1fr 1fr':'1fr', gap:12 }}>
        <Field label="Data"><input type="date" value={date} onChange={e=>setDate(e.target.value)} /></Field>
        {showClassPicker && <Field label="Turma / dia"><select value={cId} onChange={e=>setClassId(e.target.value)}>{DIAS.map(d=> <option key={d.id} value={d.id}>{d.nome}</option>)}</select></Field>}
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
        <Field label="Grupo (opcional)">
          <select value={groupId} onChange={e=>{ setGroupId(e.target.value); setStudentId(''); }}>
            <option value="">Turma inteira</option>
            {groups.map(g=> <option key={g.id} value={g.id}>{g.name}</option>)}
          </select>
        </Field>
        <Field label="Aluno (opcional)">
          <select value={studentId} onChange={e=>setStudentId(e.target.value)}>
            <option value="">Grupo inteiro / turma</option>
            {students.map(s=> <option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
        </Field>
      </div>
      <Field label="Categoria">
        <select value={category} onChange={e=>setCategory(e.target.value)}>
          {db.categories.map(c=> <option key={c} value={c}>{c}</option>)}
          <option value="__new__">+ Nova categoria...</option>
        </select>
      </Field>
      {category==='__new__' && <Field label="Nome da nova categoria"><input value={newCat} onChange={e=>setNewCat(e.target.value)} placeholder="Ex.: Assiduidade" /></Field>}
      <Field label="Descrição"><textarea rows={4} value={description} onChange={e=>setDescription(e.target.value)} placeholder="Descreva o que aconteceu..." /></Field>
    </Modal>
  );
}

function DayHistoryTab({ ctx, classId }){
  const { db } = ctx;
  const gh = db.groupHistory.filter(h=>h.classId===classId);
  const sh = db.studentHistory.filter(h=>{ const s = db.students.find(x=>x.id===h.studentId); return s && s.classId===classId; });
  const items = [...gh.map(h=>({...h, kind:'grupo'})), ...sh.map(h=>({...h, kind:'aluno'}))].sort((a,b)=> a.date<b.date?1:-1);
  return (
    <div className="fade-up card" style={{ padding:18 }}>
      <HistoryTimeline items={items} db={db} />
    </div>
  );
}

function HistoryTimeline({ items, db, emptyText }){
  if(items.length===0) return <EmptyState text={emptyText || 'Nenhum histórico registrado ainda.'} />;
  const byDate = {};
  items.forEach(it=>{ (byDate[it.date] = byDate[it.date]||[]).push(it); });
  const dates = Object.keys(byDate).sort((a,b)=> a<b?1:-1);
  return (
    <div>
      {dates.map(date=>(
        <div key={date} style={{ display:'flex', gap:16, marginBottom:16 }}>
          <div style={{ width:88, flexShrink:0, paddingTop:2 }}>
            <div style={{ fontSize:12.5, fontWeight:700, color:'var(--text-muted)' }}>{fmtDate(date)}</div>
          </div>
          <div style={{ flex:1, borderLeft:'2px solid var(--border)', paddingLeft:14, display:'flex', flexDirection:'column', gap:6 }}>
            {byDate[date].map((it,idx)=>{
              const group = it.groupId ? db.groups.find(g=>g.id===it.groupId) : null;
              return (
                <div key={idx} style={{ fontSize:13, lineHeight:1.5, position:'relative' }}>
                  <span style={{ position:'absolute', left:-19, top:6, width:7, height:7, borderRadius:99, background: it.kind==='aluno' ? 'var(--indigo)':'var(--accent)' }} />
                  {it.description} {group && <span style={{ color:'var(--text-faint)' }}>· {group.name}</span>}
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

function RenameGroupModal({ ctx, group, onClose }){
  const { actions } = ctx;
  const [name, setName] = useState(group.name);
  return (
    <Modal title="Renomear grupo" onClose={onClose} footer={
      <React.Fragment><button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
      <button className="btn btn-primary" onClick={()=>{ actions.renameGroup(group.id, name); onClose(); }}>Salvar</button></React.Fragment>
    }>
      <Field label="Novo nome"><input value={name} onChange={e=>setName(e.target.value)} autoFocus /></Field>
    </Modal>
  );
}

function AddExistingOrNewStudent({ ctx, group, onClose }){
  const { db, actions, notify } = ctx;
  const [mode, setMode] = useState('existing');
  const others = db.students.filter(s=> s.classId===group.classId && s.status==='ativo' && s.groupId!==group.id);
  const [pickId, setPickId] = useState(others[0] ? others[0].id : '');
  const [name, setName] = useState('');
  const [rgm, setRgm] = useState('');

  const submit = ()=>{
    if(mode==='existing'){
      if(!pickId) return;
      actions.transferStudent(pickId, group.id);
      onClose();
    } else {
      const id = actions.addStudent(group.classId, { name, rgm, groupId: group.id });
      if(id) onClose();
    }
  };

  return (
    <Modal title={`Adicionar aluno ao ${group.name}`} onClose={onClose} footer={
      <React.Fragment>
        <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" disabled={mode==='existing' && !pickId} onClick={submit}>Adicionar</button>
      </React.Fragment>
    }>
      <div className="card" style={{ display:'inline-flex', padding:3, gap:2, marginBottom:14 }}>
        <button onClick={()=>setMode('existing')} className="btn btn-sm" style={{ background: mode==='existing'?'var(--surface-2)':'transparent', color: mode==='existing'?'var(--text)':'var(--text-muted)' }}>Aluno já cadastrado</button>
        <button onClick={()=>setMode('new')} className="btn btn-sm" style={{ background: mode==='new'?'var(--surface-2)':'transparent', color: mode==='new'?'var(--text)':'var(--text-muted)' }}>Novo aluno</button>
      </div>
      {mode==='existing' ? (
        <Field label="Selecionar aluno">
          <select value={pickId} onChange={e=>setPickId(e.target.value)}>
            {others.map(s=> <option key={s.id} value={s.id}>{s.name} ({db.groups.find(g=>g.id===s.groupId)?.name || 'sem grupo'})</option>)}
          </select>
          {others.length===0 && <div style={{ fontSize:12, color:'var(--text-faint)', marginTop:6 }}>Não há outros alunos nesta turma.</div>}
        </Field>
      ) : (
        <React.Fragment>
          <Field label="Nome completo"><input value={name} onChange={e=>setName(e.target.value)} placeholder="Ex.: João Silva" autoFocus /></Field>
          <Field label="RGM"><input value={rgm} onChange={e=>setRgm(e.target.value)} placeholder="Ex.: 123456" /></Field>
        </React.Fragment>
      )}
    </Modal>
  );
}

function gradeBucket(v){ if(v===null || v===undefined || v<=0) return 'zero'; return String(Math.min(5, Math.max(1, Math.floor(v)))); }

function DiaryReportCard({ ctx }){
  const { db, notify } = ctx;
  const [classId, setClassId] = useState('');
  const [q, setQ] = useState('');
  const [sel, setSel] = useState([]);
  const nomeDia = id => (DIAS.find(d=>d.id===id)||{}).nome || '—';
  const entries = db.diaryEntries.filter(e=> (!classId || e.classId===classId) && (!q.trim() || `${e.description} ${e.category}`.toLowerCase().includes(q.trim().toLowerCase()))).slice().sort((x,y)=> (y.date||'').localeCompare(x.date||'')).slice(0,80);
  const toggle = id => {
    if(sel.includes(id)) return setSel(sel.filter(x=>x!==id));
    if(sel.length>=10) return notify('Escolha no máximo 10 diários por relatório.', 'error');
    setSel([...sel, id]);
  };
  const generate = ()=>{
    const chosen = sel.map(id=>db.diaryEntries.find(e=>e.id===id)).filter(Boolean).sort((x,y)=>(x.date||'').localeCompare(y.date||''));
    if(!chosen.length) return notify('Escolha ao menos um diário.', 'error');
    const { jsPDF } = window.jspdf; const doc = new jsPDF();
    const lw = 44; doc.addImage(LOGO_FULL, 'PNG', 196-lw, 8, lw, lw/LOGO_FULL_RATIO);
    doc.setFontSize(16); doc.setTextColor(10,26,74); doc.text(chosen.length===1 ? 'Relatório do diário' : `Relatório de ${chosen.length} diários`, 14, 18);
    doc.setFontSize(9); doc.setTextColor(110); doc.text(`Gerado em ${fmtDate(todayISO())}`, 14, 24);
    let y = 36;
    chosen.forEach((e,i)=>{
      const grp = db.groups.find(x=>x.id===e.groupId), st = e.studentId ? db.students.find(x=>x.id===e.studentId) : null;
      const lines = doc.splitTextToSize(e.description||'', 172).slice(0,48);
      const need = 26 + lines.length*5;
      if(y+need>282){ doc.addPage(); y = 20; }
      doc.setFillColor(238,243,250); doc.roundedRect(14, y, 182, need, 2, 2, 'F');
      doc.setFontSize(10.5); doc.setTextColor(10,26,74); doc.text(`${i+1}. ${fmtDate(e.date)}  ·  ${e.category}`, 18, y+8);
      doc.setFontSize(8.5); doc.setTextColor(81,97,138); doc.text(`${nomeDia(e.classId)}  ·  ${grp?grp.name:'Turma inteira'}${st?'  ·  '+st.name:''}`, 18, y+14);
      doc.setFontSize(10); doc.setTextColor(30); doc.text(lines, 18, y+22);
      y += need + 6;
    });
    doc.save(`diario-${chosen.length}-registro${chosen.length>1?'s':''}.pdf`);
    ctx.audit('Gerou relatório de diário', `${chosen.length} registro(s)`);
    notify('Relatório gerado.', 'success');
  };
  return (
    <div className="card" style={{ padding:18 }}>
      <h3 style={{ margin:'0 0 6px', fontSize:15 }}>Relatório de diários</h3>
      <p style={{ margin:'0 0 12px', fontSize:12.5, color:'var(--text-muted)' }}>Escolha um diário, ou até 10, e gere o relatório somente deles.</p>
      <div style={{ display:'flex', gap:10, flexWrap:'wrap', marginBottom:10 }}>
        <select value={classId} onChange={e=>setClassId(e.target.value)} style={{ maxWidth:200 }}><option value="">Todas as turmas</option>{DIAS.map(d=> <option key={d.id} value={d.id}>{d.nome}</option>)}</select>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar no texto ou na categoria" style={{ maxWidth:280 }} />
      </div>
      <div style={{ maxHeight:320, overflowY:'auto', border:'1px solid var(--border)', borderRadius:10 }}>
        {entries.map(e=>{ const grp = db.groups.find(x=>x.id===e.groupId), st = e.studentId ? db.students.find(x=>x.id===e.studentId) : null, on = sel.includes(e.id); return (
          <label key={e.id} style={{ display:'flex', gap:10, padding:'10px 12px', borderBottom:'1px solid var(--border)', cursor:'pointer', alignItems:'flex-start', background: on?'var(--accent-soft)':'transparent' }}>
            <input type="checkbox" checked={on} onChange={()=>toggle(e.id)} style={{ width:'auto', marginTop:3 }} />
            <div style={{ minWidth:0 }}>
              <div style={{ fontWeight:600, fontSize:13 }}>{fmtDate(e.date)} · {e.category}</div>
              <div style={{ fontSize:12, color:'var(--text-muted)' }}>{nomeDia(e.classId)} · {grp?grp.name:'Turma inteira'}{st?' · '+st.name:''}</div>
              <div style={{ fontSize:12.5, marginTop:2, wordBreak:'break-word' }}>{(e.description||'').slice(0,140)}</div>
            </div>
          </label>); })}
        {entries.length===0 && <div style={{ padding:16, color:'var(--text-faint)', fontSize:13 }}>Nenhum registro de diário encontrado.</div>}
      </div>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:12, gap:8, flexWrap:'wrap' }}>
        <span style={{ fontSize:12.5, color:'var(--text-muted)' }}>{sel.length} de 10 escolhidos</span>
        <div style={{ display:'flex', gap:8 }}>
          <button className="btn btn-ghost btn-sm" disabled={!sel.length} onClick={()=>setSel([])}>Limpar</button>
          <button className="btn btn-primary btn-sm" disabled={!sel.length} onClick={generate}>Gerar PDF do diário</button>
        </div>
      </div>
    </div>
  );
}

function ReportsScreen({ ctx, initial }){
  const { db, actions, notify } = ctx;
  const [classId, setClassId] = useState(initial.classId || '');
  const [groupId, setGroupId] = useState(initial.groupId || '');
  const [studentId, setStudentId] = useState(initial.studentId || '');
  const [dateStart, setDateStart] = useState('');
  const [dateEnd, setDateEnd] = useState('');
  const [category, setCategory] = useState('');
  const [reportType, setReportType] = useState('turma');

  const groups = db.groups.filter(g=> !classId || g.classId===classId);
  const students = db.students.filter(s=> s.status==='ativo' && (!classId || s.classId===classId) && (!groupId || s.groupId===groupId));

  const applyType = (type)=>{
    setReportType(type);
    if(type==='individual' && !studentId && students[0]) setStudentId(students[0].id);
  };

  const buildFilteredData = ()=>{
    let studs = db.students.filter(s=> s.status==='ativo');
    if(classId) studs = studs.filter(s=>s.classId===classId);
    if(groupId) studs = studs.filter(s=>s.groupId===groupId);
    if(studentId) studs = studs.filter(s=>s.id===studentId);

    let diary = db.diaryEntries.slice();
    if(classId) diary = diary.filter(d=>d.classId===classId);
    if(groupId) diary = diary.filter(d=>d.groupId===groupId);
    if(studentId) diary = diary.filter(d=>d.studentId===studentId);
    if(category) diary = diary.filter(d=>d.category===category);
    if(dateStart) diary = diary.filter(d=>d.date>=dateStart);
    if(dateEnd) diary = diary.filter(d=>d.date<=dateEnd);

    return { studs, diary };
  };

  const generatePDF = ()=>{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const { studs, diary } = buildFilteredData();
    const clsName = classId ? db.classes.find(c=>c.id===classId).name : 'Todas as turmas';
    const groupObj = groupId ? db.groups.find(g=>g.id===groupId) : null;
    const groupClassName = groupObj ? db.classes.find(c=>c.id===groupObj.classId).name : null;
    const groupName = groupObj ? `${groupObj.name} — ${groupClassName}` : null;
    const studentName = studentId ? db.students.find(s=>s.id===studentId).name : null;

    const lw = 44; doc.addImage(LOGO_FULL, 'PNG', 196-lw, 8, lw, lw/LOGO_FULL_RATIO);
    doc.setFontSize(16); doc.setTextColor(10,26,74);
    doc.text(`Relatório — ${studentName || groupName || clsName}`, 14, 18);
    doc.setFontSize(10); doc.setTextColor(110);
    const periodo = (dateStart||dateEnd) ? `${dateStart?fmtDate(dateStart):'início'} → ${dateEnd?fmtDate(dateEnd):'hoje'}` : 'Todo o período';
    doc.text(`Período: ${periodo}`, 14, 25);
    doc.text(`Gerado em ${fmtDate(todayISO())}`, 14, 30);

    const groupGrade = groupId ? db.groups.find(g=>g.id===groupId).groupGrade : null;
    const lastOf = (sid, kind, gid)=>{ const gr = db.individualGrades.filter(g=>g.studentId===sid && (g.kind||'aluno')===kind && (kind==='aluno' || g.groupId===gid)); return gr.length ? gr[gr.length-1].value : null; };
    const mediaInd = avg(studs.map(s=>lastOf(s.id,'aluno')));
    const obsOf = (s,g)=>{ const pick = kind=>{ const gr = db.individualGrades.filter(x=>x.studentId===s.id && (x.kind||'aluno')===kind && (kind==='aluno' || x.groupId===(g&&g.id))); const l = gr[gr.length-1]; return l && l.observation ? l.observation : ''; }; return [pick('aluno')&&('Indiv.: '+pick('aluno')), g&&pick('integrante')&&('Grupo: '+pick('integrante')), g&&g.groupGradeNote&&('Nota do grupo: '+g.groupGradeNote)].filter(Boolean).join(' | '); };
    const mediaGrupos = avg((groupId ? [db.groups.find(g=>g.id===groupId)] : db.groups.filter(g=> !classId || g.classId===classId)).map(g=>g&&g.groupGrade));

    doc.setFontSize(12); doc.setTextColor(20);
    doc.text('Resumo', 14, 40);
    doc.setFontSize(10); doc.setTextColor(80);
    let y = 46;
    doc.text(`Total de alunos: ${studs.length}`, 14, y); y+=5;
    if(!studentId){ doc.text(`Total de grupos: ${groupId?1:(new Set(studs.map(s=>s.groupId))).size}`, 14, y); y+=5; }
    doc.text(`Média individual: ${mediaInd===null?'—':fmtGrade(mediaInd)}`, 14, y); y+=5;
    doc.text(`Média dos grupos (nota do grupo): ${mediaGrupos===null?'—':fmtGrade(mediaGrupos)}`, 14, y); y+=5;
    if(groupId){ const c = groupMemberAverage(db, groupId); doc.text(`Média das notas individuais do grupo: ${fmtGrade(c.average)}`, 14, y); y+=5; }
    y+=3;

    doc.autoTable({
      startY: y+2,
      head: [['Nome','RGM','Grupo','Líder','Nota individual','Nota individual do grupo','Nota do grupo','Observações']],
      body: studs.map(s=>{
        const g = db.groups.find(x=>x.id===s.groupId);
        const gClassName = g ? db.classes.find(c=>c.id===g.classId).name : null;
        return [ s.name, s.rgm, g?`${g.name} (${gClassName})`:'—', (g&&g.leaderId===s.id)?'Sim':'Não', fmtGrade(lastOf(s.id,'aluno')), g?fmtGrade(lastOf(s.id,'integrante',g.id)):'—', g?fmtGrade(g.groupGrade):'—', obsOf(s,g) ];
      }),
      styles:{ fontSize:8.5 }, headStyles:{ fillColor:[10,26,74] }, margin:{ left:14, right:14 }
    });

    let yG = doc.lastAutoTable.finalY + 10;
    if(!studentId){
      const gl = groupId ? db.groups.filter(g=>g.id===groupId) : db.groups.filter(g=> g.status==='ativo' && (!classId || g.classId===classId));
      doc.setFontSize(12); doc.setTextColor(20); doc.text('Grupos', 14, yG);
      doc.autoTable({
        startY: yG+4,
        head: [['Grupo','Integrantes','Média das notas individuais do grupo','Nota do grupo']],
        body: gl.map(g=>{ const c = groupMemberAverage(db, g.id); const cn = db.classes.find(x=>x.id===g.classId); return [ `${g.name} (${cn?cn.name:''})`, c.rows.length, fmtGrade(c.average), fmtGrade(g.groupGrade) ]; }),
        styles:{ fontSize:8.5 }, headStyles:{ fillColor:[10,26,74] }, margin:{ left:14, right:14 }
      });
      yG = doc.lastAutoTable.finalY + 6;
    }
    doc.setFontSize(8); doc.setTextColor(110);
    doc.text('A média do grupo usa somente a nota individual do grupo de cada integrante (quem não tem nota conta 0). A nota individual do aluno não entra nesse cálculo.', 14, yG, { maxWidth:180 });
    let y2 = yG + 12;
    doc.setFontSize(12); doc.setTextColor(20);
    doc.text('Diário', 14, y2);
    doc.autoTable({
      startY: y2+4,
      head: [['Data','Grupo','Aluno','Categoria','Registro']],
      body: diary.map(d=>{
        const g = db.groups.find(x=>x.id===d.groupId);
        const dClassName = db.classes.find(c=>c.id===d.classId);
        const st = d.studentId ? db.students.find(x=>x.id===d.studentId) : null;
        return [ fmtDate(d.date), g?`${g.name} (${dClassName?dClassName.name:''})`:'—', st?st.name:'Grupo inteiro', d.category, d.description ];
      }),
      styles:{ fontSize:8, cellWidth:'wrap' }, headStyles:{ fillColor:[10,26,74] }, margin:{ left:14, right:14 },
      columnStyles:{ 4:{ cellWidth:70 } }
    });

    const filename = `relatorio_${(studentName||groupName||clsName).toLowerCase().replace(/[^a-z0-9]+/g,'_')}.pdf`;
    doc.save(filename);
    notify('PDF gerado com sucesso.', 'success');
  };

  return (
    <div className="fade-up">
      <h1 style={{ fontSize:24, margin:'0 0 4px', fontWeight:600 }}>Central de Relatórios</h1>
      <p style={{ margin:'0 0 20px', color:'var(--text-muted)', fontSize:13.5 }}>Filtre os dados e gere um PDF profissional.</p>

      <div style={{ display:'flex', gap:8, marginBottom:20, flexWrap:'wrap' }}>
        {[['turma','Turma completa'],['group','Grupo'],['individual','Individual'],['grades','Notas'],['diary','Diário'],['history','Histórico']].map(([id,label])=>(
          <button key={id} className="btn btn-sm" onClick={()=>applyType(id)} style={{ background: reportType===id?'var(--accent)':'var(--surface-2)', color: reportType===id?'#FFFFFF':'var(--text-muted)', border:'1px solid var(--border)' }}>{label}</button>
        ))}
      </div>

      <div className="card" style={{ padding:18, marginBottom:20 }}>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))', gap:14 }}>
          <Field label="Dia / turma"><select value={classId} onChange={e=>{ setClassId(e.target.value); setGroupId(''); setStudentId(''); }}><option value="">Todas</option>{DIAS.map(d=> <option key={d.id} value={d.id}>{d.nome}</option>)}</select></Field>
          <Field label="Grupo"><select value={groupId} onChange={e=>{ setGroupId(e.target.value); setStudentId(''); }}><option value="">Todos</option>{groups.map(g=> <option key={g.id} value={g.id}>{g.name}</option>)}</select></Field>
          <Field label="Aluno"><select value={studentId} onChange={e=>setStudentId(e.target.value)}><option value="">Todos</option>{students.map(s=> <option key={s.id} value={s.id}>{s.name}</option>)}</select></Field>
          <Field label="Categoria (diário)"><select value={category} onChange={e=>setCategory(e.target.value)}><option value="">Todas</option>{db.categories.map(c=> <option key={c} value={c}>{c}</option>)}</select></Field>
          <Field label="Data inicial"><input type="date" value={dateStart} onChange={e=>setDateStart(e.target.value)} /></Field>
          <Field label="Data final"><input type="date" value={dateEnd} onChange={e=>setDateEnd(e.target.value)} /></Field>
        </div>
        <div style={{ display:'flex', justifyContent:'flex-end', marginTop:6 }}>
          <button className="btn btn-primary" onClick={generatePDF}><Icon path={ICONS.download} size={15}/> Gerar PDF</button>
        </div>
      </div>

      <div className="card" style={{ padding:18, marginBottom:20 }}>
        <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:4 }}>
          <Icon path={ctx.sync.status==='connected' ? ICONS.database : ICONS.cloudOff} size={16} style={{ color: ctx.sync.status==='connected' ? 'var(--success)' : 'var(--text-faint)' }}/>
          <h3 style={{ margin:0, fontSize:14, fontWeight:600 }}>Banco de dados</h3>
        </div>
        <p style={{ margin:'6px 0 12px', fontSize:12.5, color:'var(--text-muted)' }}>
          {ctx.sync.status==='connected' ? 'Conectado a um banco SQL — os dados são acessíveis de qualquer dispositivo com as mesmas credenciais.' : 'Salvando apenas neste navegador (localStorage). Conecte um banco SQL para acessar de outros dispositivos.'}
        </p>
        <button className="btn btn-soft btn-sm" style={{ display: ctx.sync.isAdm?'inline-flex':'none' }} onClick={()=>ctx.setModal({ type:'dbSettings' })}>{ctx.sync.status==='connected' ? 'Gerenciar conexão' : 'Conectar banco de dados'}</button>
      </div>

      <DiaryReportCard ctx={ctx} />
      <div className="card" style={{ padding:18, borderColor:'#DC2F2F33', display: ctx.sync.isAdm?'block':'none' }}>
        <h3 style={{ margin:'0 0 6px', fontSize:14, fontWeight:600, color:'var(--danger-text)' }}>Zona de dados</h3>
        <p style={{ margin:'0 0 12px', fontSize:12.5, color:'var(--text-muted)' }}>
          {db.meta && db.meta.demo ? 'Você está usando dados de exemplo (gerados manualmente para teste).' : 'Base real — sem dados de exemplo.'}
        </p>
        <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
          <button className="btn btn-soft btn-sm" onClick={()=> ctx.askConfirm({ title:'Carregar dados de exemplo', message:'Isso substituirá TODOS os dados atuais por um conjunto de exemplo (alunos, grupos e notas fictícios), só para teste' + (ctx.sync.status==='connected' ? ' — inclusive no banco SQL conectado.' : '.') + ' Deseja continuar?', confirmLabel:'Carregar exemplo', onConfirm: actions.resetDemoData })}>Carregar dados de exemplo (opcional, para teste)</button>
          <button className="btn btn-danger btn-sm" onClick={()=> ctx.askConfirm({ title:'Limpar todos os dados', tone:'danger', message:'Isso apagará todos os grupos, alunos, notas e diário' + (ctx.sync.status==='connected' ? ' — inclusive no banco SQL conectado.' : '.') + ' As 6 turmas e categorias serão mantidas vazias, prontas para você começar do zero. Esta ação não pode ser desfeita.', confirmLabel:'Apagar tudo', onConfirm: actions.clearAllData })}>Limpar tudo e começar do zero</button>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   BUSCA GLOBAL
   ============================================================ */
function SearchScreen({ ctx, query }){
  const { db, navigate } = ctx;
  const q = query.trim().toLowerCase();
  const students = db.students.filter(s=> s.status==='ativo' && (s.name.toLowerCase().includes(q) || s.rgm.includes(q.trim())));
  const groups = db.groups.filter(g=> g.status==='ativo' && g.name.toLowerCase().includes(q));

  return (
    <div className="fade-up">
      <h1 style={{ fontSize:22, margin:'0 0 4px', fontWeight:600 }}>Resultados para "{query}"</h1>
      <p style={{ margin:'0 0 20px', color:'var(--text-muted)', fontSize:13 }}>{students.length + groups.length} resultado(s) encontrado(s)</p>

      {groups.length>0 && (
        <div style={{ marginBottom:22 }}>
          <h3 style={{ fontSize:14, fontWeight:600, marginBottom:10 }}>Grupos</h3>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))', gap:12 }}>
            {groups.map(g=>{
              const cls = db.classes.find(c=>c.id===g.classId);
              const count = db.students.filter(s=>s.groupId===g.id && s.status==='ativo').length;
              return (
                <div key={g.id} onClick={()=>navigate('group',{groupId:g.id})} className="card card-hover" style={{ padding:14, cursor:'pointer' }}>
                  <div style={{ fontWeight:700 }}>{g.name}</div>
                  <div style={{ fontSize:12, color:'var(--text-faint)', marginTop:4 }}>{cls.name} · {count} integrantes</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {students.length>0 && (
        <div>
          <h3 style={{ fontSize:14, fontWeight:600, marginBottom:10 }}>Alunos</h3>
          <div className="card" style={{ overflowX:'auto' }}>
            <table>
              <thead><tr><th>Nome</th><th>RGM</th><th>Turma</th><th>Grupo</th></tr></thead>
              <tbody>
                {students.map(s=>{
                  const cls = db.classes.find(c=>c.id===s.classId);
                  const group = db.groups.find(g=>g.id===s.groupId);
                  return (
                    <tr key={s.id} onClick={()=>navigate('student',{studentId:s.id})} style={{ cursor:'pointer' }}>
                      <td style={{ fontWeight:600 }}>{s.name}</td><td>{s.rgm}</td><td>{cls.name}</td><td>{group?group.name:'—'}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {students.length===0 && groups.length===0 && <EmptyState text="Nada encontrado. Tente outro termo." />}
    </div>
  );
}

`;

// rótulos das colunas para a visão em cartões no celular
(function(){
  function labelTables(){
    document.querySelectorAll('table').forEach(t=>{
      const heads = Array.from(t.querySelectorAll('thead th')).map(h=>h.textContent.trim());
      if(!heads.length) return;
      t.querySelectorAll('tbody tr').forEach(tr=>{
        Array.from(tr.children).forEach((td,i)=>{ if(td.tagName==='TD' && !td.hasAttribute('colspan')) td.setAttribute('data-label', heads[i]||''); });
      });
    });
  }
  let tm = null;
  new MutationObserver(()=>{ clearTimeout(tm); tm = setTimeout(labelTables, 30); }).observe(document.getElementById('root'), { childList:true, subtree:true });
  labelTables();
})();

(function boot(){
  const start = ()=> ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  fetch('./pacora-config.json', { cache:'no-store' }).then(r=> r.ok ? r.json() : null).catch(()=>null).then(cfg=>{
    if(cfg && cfg.url && cfg.anonKey){ window.PACORA_DEFAULT_CONFIG = { url:String(cfg.url).trim(), anonKey:String(cfg.anonKey).trim() }; }
    start();
  });
})();
</script>
